<style>
:root{color-scheme:light}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
:root{
  --bg:#EDF0F3;
  --surface:#FBFCFD;
  --surface-2:#E4E9EE;
  --ink:#15202B;
  --ink-2:#465465;
  --ink-3:#5E6C7B;
  --line:#D2D9E1;
  --line-strong:#A9B5C2;
  --accent:#0A62C9;
  --accent-soft:#DBE8F8;
  --on-color:#FFFFFF;
  --earth:#8A591A;
  --earth-soft:#F0E3CF;
  --fire:#B03A0C;
  --fire-soft:#F7DFD2;
  --water:#0B7285;
  --water-soft:#D4EDF1;
  --air:#54579E;
  --air-soft:#E2E2F3;
  --ok:#2C7A4B;
  --warn:#9A5B00;
  --focus:#0A62C9;
  --font-display:"Marcellus SC","Marcellus",Georgia,"Times New Roman",serif;
  --font-body:"Alegreya Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F141A;
    --surface:#161D25;
    --surface-2:#1E2731;
    --ink:#E6EBF0;
    --ink-2:#A5B1BE;
    --ink-3:#8793A0;
    --line:#28323D;
    --line-strong:#3A4755;
    --accent:#5AA9FF;
    --accent-soft:#15304E;
    --on-color:#0B1520;
    --earth:#D9A962;
    --earth-soft:#33281A;
    --fire:#FF8C57;
    --fire-soft:#3B2319;
    --water:#45C7D9;
    --water-soft:#12323A;
    --air:#AAADF3;
    --air-soft:#25274A;
    --ok:#6FD39A;
    --warn:#F2B35B;
    --focus:#5AA9FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141A;
  --surface:#161D25;
  --surface-2:#1E2731;
  --ink:#E6EBF0;
  --ink-2:#A5B1BE;
  --ink-3:#8793A0;
  --line:#28323D;
  --line-strong:#3A4755;
  --accent:#5AA9FF;
  --accent-soft:#15304E;
  --on-color:#0B1520;
  --earth:#D9A962;
  --earth-soft:#33281A;
  --fire:#FF8C57;
  --fire-soft:#3B2319;
  --water:#45C7D9;
  --water-soft:#12323A;
  --air:#AAADF3;
  --air-soft:#25274A;
  --ok:#6FD39A;
  --warn:#F2B35B;
  --focus:#5AA9FF;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:where(a,button,summary):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[data-el="earth"]{--el:var(--earth);--el-soft:var(--earth-soft)}
[data-el="fire"]{--el:var(--fire);--el-soft:var(--fire-soft)}
[data-el="water"]{--el:var(--water);--el-soft:var(--water-soft)}
[data-el="air"]{--el:var(--air);--el-soft:var(--air-soft)}

/* Layout */
.shell{max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px);padding-block:28px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.rail{display:contents}
.sections{display:grid;gap:22px;min-width:0;container-type:inline-size}
@media (min-width:960px){
  .shell{grid-template-columns:292px minmax(0,1fr);column-gap:40px;align-items:start}
  .rail{display:flex;flex-direction:column;gap:24px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 40px);overflow-y:auto;padding-bottom:8px;scrollbar-width:thin}
}

/* Nameplate */
.plate{display:grid;gap:14px}
.eyebrow{margin:0;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.plate h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(32px,4vw,40px);line-height:1.04;letter-spacing:.005em;text-wrap:balance}
.lede{margin:0;color:var(--ink-2);max-width:42ch}
.sockets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.socket{display:grid;justify-items:center;gap:2px;padding:10px 4px 9px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--ink-3);text-align:center;transition:background .2s,border-color .2s,color .2s}
.socket svg{width:22px;height:22px;margin-bottom:2px}
.socket-name{font-family:var(--font-display);font-size:15px;line-height:1.1;color:var(--ink-2)}
.socket-state{font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.socket[data-has="1"]{border-style:solid;border-color:var(--el);background:var(--el-soft);color:var(--el)}
.socket[data-has="1"] .socket-name{color:var(--el)}
.socket[data-locked="1"]{border-style:dotted}
.overall{display:grid;gap:8px}
.overall-line{margin:0;display:flex;align-items:baseline;gap:6px}
.overall-num{font-family:var(--font-mono);font-size:28px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.overall-of{color:var(--ink-2);font-size:15px}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .25s ease}
.status{margin:0;display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--ink-2)}
.status::before{content:"";flex:none;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--ok)}
.status[data-tone="busy"]::before{background:var(--accent)}
.status[data-tone="warn"]::before{background:var(--warn)}
.status[data-tone="off"]::before{background:var(--line-strong)}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink-2);cursor:pointer;user-select:none;width:max-content;max-width:100%}
.switch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.switch-track{position:relative;flex:none;width:34px;height:20px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-strong);transition:background .15s,border-color .15s}
.switch-track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-3);transition:transform .15s,background .15s}
.switch input:checked + .switch-track{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .switch-track::after{transform:translateX(14px);background:var(--on-color)}
.switch input:focus-visible + .switch-track{outline:2px solid var(--focus);outline-offset:2px}

/* Section list */
.toc ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc-link{--c:var(--accent);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none}
.toc-link[data-el]{--c:var(--el)}
.toc-link:hover{background:var(--surface-2)}
.toc-name{font-size:15.5px;line-height:1.3}
.toc-short{display:none}
.toc-count{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.toc-bar{grid-column:1 / -1;height:4px}
.toc-bar i{background:var(--c)}
@media (max-width:959.98px){
  .toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:calc(-1 * clamp(16px,3vw,32px));padding:8px clamp(16px,3vw,32px);background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .toc ul{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .toc ul::-webkit-scrollbar{display:none}
  .toc li{flex:none}
  .toc-link{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  .toc-long,.toc-bar{display:none}
  .toc-short{display:inline}
  .toc-name{font-size:14.5px;white-space:nowrap}
}

/* Panels */
.panel{--sec:var(--accent);--sec-soft:var(--accent-soft);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.panel[data-el]{--sec:var(--el);--sec-soft:var(--el-soft)}
.panel-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.glyph{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sec-soft);color:var(--sec)}
.glyph svg{width:20px;height:20px}
.panel-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:23px;line-height:1.15;text-wrap:balance}
.panel-count{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:99px;background:var(--surface-2)}
.panel-intro{margin:16px 20px 0;color:var(--ink-2);max-width:68ch}
.panel-where{display:flex;flex-wrap:wrap;gap:8px;margin:12px 20px 0}
.tips{margin:14px 20px 0;padding:12px 16px 12px 34px;border-radius:12px;background:var(--sec-soft);font-size:15px;line-height:1.45;display:grid;gap:6px}
.tips li::marker{color:var(--sec)}
.tips-after{margin-bottom:20px}
.group-title{margin:22px 20px 2px;font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.group-hint{margin:2px 20px 0;font-size:14.5px;color:var(--ink-2)}
.footnote{margin:4px 20px 20px;font-size:14px;color:var(--ink-2);max-width:72ch}

/* Checklist rows */
.items{list-style:none;margin:8px 0 0;padding:0 8px 8px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:14px;row-gap:8px;padding:13px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tick{appearance:none;-webkit-appearance:none;margin:1px 0 0;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-content:center;cursor:pointer;transition:background .12s,border-color .12s}
.tick::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--on-color);border-bottom:2.5px solid var(--on-color);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .12s ease}
.tick:hover{border-color:var(--sec)}
.tick:checked{background:var(--sec);border-color:var(--sec)}
.item[data-el] .tick:checked{background:var(--el);border-color:var(--el)}
.tick:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.tick:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.item-body{display:grid;gap:3px;min-width:0;cursor:pointer}
.item-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.item-title{font-weight:500;font-size:16.5px;line-height:1.3}
.item-note{display:block;color:var(--ink-2);font-size:15px;line-height:1.45;max-width:68ch}
.item-note a{color:var(--sec)}
.item.is-done .item-title{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--line-strong)}
.item.is-done .item-note{color:var(--ink-3)}
.item-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.where-text{font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.step-num{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:99px;background:var(--sec-soft);color:var(--sec);font-family:var(--font-mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.item.is-info .item-body{cursor:default}
.info-mark{width:22px;height:22px;border-radius:6px;border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--ink-3);font-family:var(--font-mono);font-size:13px;line-height:1}
.chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:11.5px;line-height:1;padding:4px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip-new{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip-el{border-color:transparent;background:var(--el-soft);color:var(--el)}
.chip-opt{border-style:dashed}
.coord{display:inline-flex;align-items:baseline;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--font-mono);font-size:12.5px;line-height:1.2;color:var(--ink-3);cursor:pointer;white-space:nowrap;transition:border-color .12s,color .12s}
.coord:hover{border-color:var(--sec);color:var(--ink-2)}
.coord-xy{color:var(--ink);font-weight:500}
#app[data-hide-done="1"] .item.is-done{display:none}

/* Catch-up quests */
.steps{grid-column:2;margin:4px 0 2px;padding:0;list-style:none;counter-reset:step;display:grid;gap:10px}
.steps li{counter-increment:step;display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:10px;row-gap:6px;font-size:15px;line-height:1.45;color:var(--ink-2)}
.steps li::before{content:counter(step);display:grid;place-items:center;width:22px;height:22px;border-radius:99px;background:var(--el-soft);color:var(--el);font-family:var(--font-mono);font-size:12px;font-weight:500}
.step-where{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.quest.is-done .steps{display:none}
.air-note{display:flex;gap:10px;align-items:flex-start;margin:6px 20px 20px;padding:12px 14px;border:1px dotted var(--line-strong);border-radius:12px;color:var(--ink-2);font-size:15px;line-height:1.45}
.air-note svg{flex:none;width:20px;height:20px;color:var(--air);margin-top:1px}

/* Talents */
.spec{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:16px 20px 0;padding:0;border:0;min-width:0}
.seg{position:relative;display:block;cursor:pointer}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg-body{display:grid;gap:2px;height:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:background .12s,border-color .12s}
.seg-name{font-family:var(--font-display);font-size:17px;line-height:1.15}
.seg-use{font-size:13.5px;color:var(--ink-2)}
.seg:hover .seg-body{border-color:var(--line-strong)}
.seg input:checked + .seg-body{border-color:var(--accent);background:var(--accent-soft)}
.seg input:focus-visible + .seg-body{outline:2px solid var(--focus);outline-offset:2px}
.build-blurb{margin:14px 20px 0;color:var(--ink-2);max-width:68ch}
.build{list-style:none;margin:10px 20px 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.build li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 12px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
.build li:first-child{border-top:0}
.build-name{font-weight:500}
.build-pts{font-family:var(--font-mono);font-size:13.5px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.build-row{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.build-fx{grid-column:1 / -1;color:var(--ink-2);font-size:14.5px}
.build-src{margin:8px 20px 0;font-size:13px;color:var(--ink-3)}

/* Totem bar */
.sets{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:10px 20px 0}
.set{display:grid;gap:8px;align-content:start;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.set-name{margin:0;font-family:var(--font-display);font-size:16px}
.set-slots{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14.5px}
.set-slots li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:baseline}
.slot-el{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--el)}
.slot-empty{color:var(--ink-3)}
.set-note{margin:0;font-size:13.5px;color:var(--ink-2)}

/* Level 30 preview */
.next-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:16px 20px 20px}
.lvl{padding:12px 14px;border:1px dashed var(--line-strong);border-radius:12px}
.lvl-num{margin:0 0 6px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lvl ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14.5px;line-height:1.4;color:var(--ink-2)}

@container (min-width:480px){
  .spec{grid-template-columns:repeat(3,minmax(0,1fr))}
  .next-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container (min-width:620px){
  .item{grid-template-columns:22px minmax(0,1fr) auto}
  .item-meta{grid-column:auto;justify-content:flex-end;max-width:260px}
  .item-meta .where-text{text-align:right}
  .quest .steps,.item .steps{grid-column:2 / -1}
  .build li{grid-template-columns:minmax(0,1.1fr) auto 64px minmax(0,2fr)}
  .build-fx{grid-column:auto}
  .sets{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container (min-width:720px){
  .next-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* Footer, toast */
.foot{display:grid;gap:10px;padding:6px 4px 0;font-size:14.5px;color:var(--ink-2)}
.foot p{margin:0;max-width:72ch}
.foot .group-title{margin:10px 0 0}
.sources{margin:0;padding-left:18px;display:grid;gap:4px}
.sources span{color:var(--ink-3)}
.reset-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px}
.reset{padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);cursor:pointer}
.reset:hover{border-color:var(--fire);color:var(--fire)}
.reset.armed{border-color:var(--fire);background:var(--fire-soft);color:var(--fire)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast input{width:280px;max-width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-family:var(--font-mono);font-size:13px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
.companion{margin:0;font-size:14.5px;color:var(--ink-2)}
.whoami{margin-top:4px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:15px}
.whoami:empty{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
"use strict";

/* ---------- derived ---------- */
function sectionItems(sec) {
  if (sec.groups) return sec.groups.reduce((all, g) => all.concat(g.items), []);
  if (sec.quests) return sec.quests;
  if (sec.check) return [sec.check];
  return sec.items || [];
}
const CHECKABLE = {};
const VALID = new Set();
SECTIONS.forEach((sec) => {
  const ids = sectionItems(sec).filter((it) => !it.info).map((it) => it.id);
  ids.forEach((id) => VALID.add(id));
  CHECKABLE[sec.id] = ids;
});
const TOTAL = VALID.size;

/* ---------- helpers ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pct(d, t) { return t ? Math.round((d / t) * 100) : 0; }
function countIn(st, ids) { return ids.filter((id) => st.done.has(id)).length; }
function countAll(st) { let n = 0; st.done.forEach((id) => { if (VALID.has(id)) n++; }); return n; }
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  try { return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  catch (e) { return d.toISOString().slice(0, 16).replace("T", " "); }
}
function wayText(w) { return "/way " + w.zone + " " + w.x + " " + w.y; }
function coordBtn(w) {
  return '<button type="button" class="coord" data-way="' + esc(wayText(w)) + '" title="Copy a TomTom /way command">'
    + (w.label ? "<span>" + esc(w.label) + " ·</span>" : "")
    + "<span>" + esc(w.zone) + "</span>"
    + '<span class="coord-xy">' + esc(w.x) + ", " + esc(w.y) + "</span></button>";
}
function chips(it) {
  let h = "";
  if (it.rank) h += '<span class="chip">Rank ' + it.rank + "</span>";
  if (it.lvl) h += '<span class="chip">Lvl ' + it.lvl + "</span>";
  if (it.tag === "new") h += '<span class="chip chip-new">New in Forever</span>';
  if (it.el) h += '<span class="chip chip-el" data-el="' + it.el + '">' + EL_NAME[it.el] + " totem</span>";
  if (it.opt) h += '<span class="chip chip-opt">Optional</span>';
  return h;
}

/* ---------- rendering ---------- */
function itemHTML(it, isDone, num) {
  const note = it.noteHTML ? it.noteHTML : (it.note ? esc(it.note) : "");
  if (it.info) {
    return '<li class="item is-info"><span class="info-mark" aria-hidden="true">↓</span>'
      + '<div class="item-body"><span class="item-head"><span class="item-title">' + esc(it.name) + "</span>" + chips(it) + "</span>"
      + (note ? '<span class="item-note">' + note + "</span>" : "") + "</div></li>";
  }
  const cid = "cb-" + it.id;
  let meta = "";
  if (it.where) meta = '<div class="item-meta">' + it.where.map(coordBtn).join("") + "</div>";
  else if (it.whereText) meta = '<div class="item-meta"><span class="where-text">' + esc(it.whereText) + "</span></div>";
  return '<li class="item' + (isDone ? " is-done" : "") + '" data-item="' + it.id + '">'
    + '<input type="checkbox" class="tick" id="' + cid + '" data-id="' + it.id + '"' + (isDone ? " checked" : "") + ">"
    + '<label class="item-body" for="' + cid + '"><span class="item-head">'
    + (num ? '<span class="step-num">' + num + "</span>" : "")
    + '<span class="item-title">' + esc(it.name) + "</span>" + chips(it) + "</span>"
    + (note ? '<span class="item-note">' + note + "</span>" : "") + "</label>" + meta + "</li>";
}

function questHTML(q, isDone) {
  const cid = "cb-" + q.id;
  return '<li class="item quest' + (isDone ? " is-done" : "") + '" data-item="' + q.id + '" data-el="' + q.el + '">'
    + '<input type="checkbox" class="tick" id="' + cid + '" data-id="' + q.id + '"' + (isDone ? " checked" : "") + ">"
    + '<label class="item-body" for="' + cid + '"><span class="item-head"><span class="item-title">' + esc(q.name) + "</span>"
    + '<span class="chip chip-el" data-el="' + q.el + '">' + esc(q.sub) + "</span></span>"
    + '<span class="item-note">Reward: ' + esc(q.reward) + ". Steps if you still need it:</span></label>"
    + '<ol class="steps">' + q.steps.map((s) => '<li><span>' + esc(s.t) + "</span>"
      + (s.where ? '<span class="step-where">' + s.where.map(coordBtn).join("") + "</span>" : "") + "</li>").join("")
    + "</ol></li>";
}

function buildHTML(b) {
  return '<p class="build-blurb">' + esc(b.blurb) + '</p><ul class="build">'
    + b.rows.map((r) => '<li><span class="build-name">' + esc(r.n) + '</span><span class="build-pts">' + r.pts
      + '</span><span class="build-row">Row ' + r.row + '</span><span class="build-fx">' + esc(r.fx) + "</span></li>").join("")
    + '</ul><p class="build-src">Build source: ' + esc(b.src) + "</p>";
}

function talentsHTML(sec, st) {
  const spec = BUILDS[st.spec] ? st.spec : "enh";
  return '<fieldset class="spec"><legend class="sr-only">Choose a build</legend>'
    + Object.keys(BUILDS).map((k) => '<label class="seg"><input type="radio" name="spec" id="spec-' + k + '" value="' + k + '"'
      + (k === spec ? " checked" : "") + '><span class="seg-body"><span class="seg-name">' + esc(BUILDS[k].label)
      + '</span><span class="seg-use">' + esc(BUILDS[k].use) + "</span></span></label>").join("")
    + '</fieldset><div id="build-slot">' + buildHTML(BUILDS[spec]) + "</div>"
    + '<ul class="items">' + itemHTML(sec.check, st.done.has(sec.check.id)) + "</ul>";
}

function setsHTML(sec) {
  const slot = (el, v) => '<li data-el="' + el + '"><span class="slot-el">' + EL_NAME[el] + "</span><span>" + esc(v) + "</span></li>";
  return '<h3 class="group-title">Suggested sets</h3><div class="sets">'
    + sec.sets.map((s) => '<div class="set"><p class="set-name">' + esc(s.name) + '</p><ul class="set-slots">'
      + slot("earth", s.earth) + slot("fire", s.fire) + slot("water", s.water)
      + '<li data-el="air" class="slot-empty"><span class="slot-el">Air</span><span>Empty until 30</span></li></ul>'
      + (s.note ? '<p class="set-note">' + esc(s.note) + "</p>" : "") + "</div>").join("")
    + "</div>";
}

function nextHTML() {
  return '<div class="next-grid">' + NEXT.map((n) => '<div class="lvl"><p class="lvl-num">Level ' + n.lvl + "</p><ul>"
    + n.items.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul></div>").join("") + "</div>";
}

function panelHTML(sec, st) {
  const ids = CHECKABLE[sec.id];
  let body = "";
  if (sec.intro) body += '<p class="panel-intro">' + esc(sec.intro) + "</p>";
  if (sec.where) body += '<div class="panel-where">' + sec.where.map(coordBtn).join("") + "</div>";
  if (sec.tips) body += '<ul class="tips">' + sec.tips.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>";
  if (sec.groups) {
    body += sec.groups.map((g) => '<h3 class="group-title">' + esc(g.title) + "</h3>"
      + (g.hint ? '<p class="group-hint">' + esc(g.hint) + "</p>" : "")
      + '<ul class="items">' + g.items.map((it) => itemHTML(it, st.done.has(it.id))).join("") + "</ul>").join("");
  }
  if (sec.items) {
    body += sec.steps
      ? '<ol class="items">' + sec.items.map((it, i) => itemHTML(it, st.done.has(it.id), i + 1)).join("") + "</ol>"
      : '<ul class="items">' + sec.items.map((it) => itemHTML(it, st.done.has(it.id))).join("") + "</ul>";
  }
  if (sec.quests) body += '<ul class="items">' + sec.quests.map((q) => questHTML(q, st.done.has(q.id))).join("") + "</ul>";
  if (sec.air) body += '<p class="air-note">' + GLYPH.air + "<span>" + esc(sec.air) + "</span></p>";
  if (sec.builds) body += talentsHTML(sec, st);
  if (sec.sets) body += setsHTML(sec);
  if (sec.after) body += '<ul class="tips tips-after">' + sec.after.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>";
  if (sec.footnote) body += '<p class="footnote">' + esc(sec.footnote) + "</p>";
  if (sec.id === "next") body += nextHTML();
  return '<section class="panel" id="' + sec.id + '"' + (sec.el ? ' data-el="' + sec.el + '"' : "") + ' aria-labelledby="h-' + sec.id + '">'
    + '<div class="panel-head"><span class="glyph">' + GLYPH[sec.glyph] + '</span><h2 id="h-' + sec.id + '">' + esc(sec.title) + "</h2>"
    + (ids.length ? '<span class="panel-count" data-pcount="' + sec.id + '">' + countIn(st, ids) + "/" + ids.length + "</span>" : "")
    + "</div>" + body + "</section>";
}

function socketsHTML(st) {
  return '<div class="sockets" aria-label="Your elemental totems">' + SOCKETS.map((s) => {
    const has = !!(s.from && st.done.has(s.from));
    return '<div class="socket" data-el="' + s.el + '" data-socket="' + s.el + '" data-has="' + (has ? "1" : "0") + '"' + (s.from ? "" : ' data-locked="1"') + ">"
      + GLYPH[s.el] + '<span class="socket-name">' + EL_NAME[s.el] + '</span><span class="socket-state">'
      + (s.from ? (has ? "In bags" : "Not yet") : "Level 30") + "</span></div>";
  }).join("") + "</div>";
}

function plateHTML(st) {
  const n = countAll(st);
  return '<header class="plate"><p class="eyebrow">WoW Forever beta · Dwarf Shaman</p><h1>' + TITLE + "</h1>"
    + '<p class="lede">Everything you can train, unlock and quest for at the beta’s level 20 cap. Tick things off as you play.</p>'
    + '<p class="companion">Next: <a href="/gear">best-in-slot gear for your talent build</a>.</p>'
    + socketsHTML(st)
    + '<div class="overall"><p class="overall-line"><span class="overall-num" id="ov-num">' + n + '</span><span class="overall-of">of ' + TOTAL + " done</span></p>"
    + '<span class="bar" aria-hidden="true"><i id="ov-bar" style="width:' + pct(n, TOTAL) + '%"></i></span></div>'
    + '<p class="status" id="save-status" role="status" aria-live="polite"></p>'
    + '<label class="switch" for="hide-done"><input type="checkbox" id="hide-done"><span class="switch-track" aria-hidden="true"></span><span>Hide finished items</span></label>'
    + "</header>";
}

function tocHTML(st) {
  return '<nav class="toc" aria-label="Sections"><ul>' + SECTIONS.map((sec) => {
    const ids = CHECKABLE[sec.id];
    const d = countIn(st, ids);
    return '<li><a class="toc-link" href="#' + sec.id + '"' + (sec.el ? ' data-el="' + sec.el + '"' : "") + ">"
      + '<span class="toc-name"><span class="toc-long">' + esc(sec.title) + '</span><span class="toc-short">' + esc(sec.short) + "</span></span>"
      + (ids.length
        ? '<span class="toc-count" data-count="' + sec.id + '">' + d + "/" + ids.length + '</span><span class="bar toc-bar" aria-hidden="true"><i data-bar="' + sec.id + '" style="width:' + pct(d, ids.length) + '%"></i></span>'
        : '<span class="toc-count">Preview</span>')
      + "</a></li>";
  }).join("") + "</ul></nav>";
}

function footerHTML() {
  return '<footer class="foot"><p>Built from WoW Forever beta data and community guides as of late September 2026. Details can change before launch on November 4, and beta characters are wiped when the beta ends.</p>'
    + '<p>Tap any coordinate to copy a TomTom <code>/way</code> command.</p>'
    + '<p>Your ticks are saved in this browser and don’t sync between devices. Fan-made and not affiliated with Blizzard Entertainment. <a href="/">Toolkit home</a></p>'
    + '<div class="whoami" data-whoami></div>'
    + '<h3 class="group-title">Sources</h3><ul class="sources">'
    + SOURCES.map((s) => '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + "</a> <span>" + esc(s.site) + "</span></li>").join("")
    + '</ul><div class="reset-row"><button type="button" class="reset" id="reset-btn">Clear all ticks</button></div></footer>';
}

function appHTML(st) {
  return '<div class="shell"><aside class="rail">' + plateHTML(st) + tocHTML(st) + '</aside><main class="sections">'
    + SECTIONS.map((sec) => panelHTML(sec, st)).join("") + footerHTML() + "</main></div>"
    + '<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>';
}

/* ---------- state (saved in this browser) ---------- */
const STORE_KEY = "forever-shaman20:checklist:v1";
let canSave = true;
function readState() {
  const st = { done: new Set(), spec: "enh", savedAt: null };
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const p = raw ? JSON.parse(raw) : null;
    if (p && Array.isArray(p.done)) p.done.forEach((id) => { if (VALID.has(id)) st.done.add(id); });
    if (p && BUILDS[p.spec]) st.spec = p.spec;
    if (p && typeof p.savedAt === "string") st.savedAt = p.savedAt;
  } catch (e) { /* start fresh */ }
  return st;
}
function readHide() { try { return localStorage.getItem(HIDE_KEY) === "1"; } catch (e) { return false; } }
function writeHide(on) { try { localStorage.setItem(HIDE_KEY, on ? "1" : "0"); } catch (e) { /* ignore */ } }
function save() {
  const savedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, done: Array.from(state.done).sort(), spec: state.spec, savedAt: savedAt }));
    state.savedAt = savedAt;
    canSave = true;
  } catch (e) { canSave = false; }
  setStatus();
}
function setStatus() {
  const el = document.getElementById("save-status");
  if (!el) return;
  let text = "Your ticks save in this browser.";
  let tone = "ok";
  if (!canSave) { text = "This browser won’t let the page save, so ticks last until you close the tab. Private windows often do this."; tone = "warn"; }
  else if (state.savedAt) text = "Saved in this browser " + fmtTime(state.savedAt) + ".";
  el.textContent = text;
  el.setAttribute("data-tone", tone);
}
function changed() { save(); track("state", progressSummary()); }

/* ---------- visit stats (see /assets/track.js) ---------- */
function track(kind, data) { try { if (window.shamanTrack) window.shamanTrack(kind, data); } catch (e) { /* stats are optional */ } }
function progressSummary() { return { spec: state.spec, done: countAll(state), total: TOTAL }; }

/* ---------- live updates ---------- */
function refresh() {
  let total = 0;
  SECTIONS.forEach((sec) => {
    const ids = CHECKABLE[sec.id];
    if (!ids.length) return;
    const d = countIn(state, ids);
    total += d;
    app.querySelectorAll('[data-count="' + sec.id + '"],[data-pcount="' + sec.id + '"]').forEach((el) => { el.textContent = d + "/" + ids.length; });
    const bar = app.querySelector('[data-bar="' + sec.id + '"]');
    if (bar) bar.style.width = pct(d, ids.length) + "%";
  });
  const num = document.getElementById("ov-num");
  if (num) num.textContent = String(total);
  const bar = document.getElementById("ov-bar");
  if (bar) bar.style.width = pct(total, TOTAL) + "%";
  SOCKETS.forEach((s) => {
    if (!s.from) return;
    const el = app.querySelector('[data-socket="' + s.el + '"]');
    if (!el) return;
    const has = state.done.has(s.from);
    el.setAttribute("data-has", has ? "1" : "0");
    const lab = el.querySelector(".socket-state");
    if (lab) lab.textContent = has ? "In bags" : "Not yet";
  });
}

function applyHide(on) {
  app.setAttribute("data-hide-done", on ? "1" : "0");
  const cb = document.getElementById("hide-done");
  if (cb) cb.checked = on;
}

let toastTimer = 0;
function showToast(msg, copyText) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = "";
  const span = document.createElement("span");
  span.textContent = msg;
  t.appendChild(span);
  if (copyText) {
    const inp = document.createElement("input");
    inp.type = "text";
    inp.readOnly = true;
    inp.id = "toast-copy";
    inp.value = copyText;
    inp.setAttribute("aria-label", "Waypoint command");
    t.appendChild(inp);
  }
  t.hidden = false;
  if (copyText) { const inp = document.getElementById("toast-copy"); if (inp) { inp.focus(); inp.select(); } }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, copyText ? 9000 : 2600);
}

function copyWay(text) {
  const fallback = () => showToast("Copy this:", text);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast("Copied " + text), fallback);
    } else fallback();
  } catch (e) { fallback(); }
}

let resetArmed = false;
let resetTimer = 0;
function onReset(btn) {
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = "Tap again to clear every tick";
    btn.classList.add("armed");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = "Clear all ticks"; btn.classList.remove("armed"); }, 4000);
    return;
  }
  resetArmed = false;
  clearTimeout(resetTimer);
  btn.textContent = "Clear all ticks";
  btn.classList.remove("armed");
  state.done.clear();
  app.querySelectorAll(".tick").forEach((cb) => {
    cb.checked = false;
    const li = cb.closest(".item");
    if (li) li.classList.remove("is-done");
  });
  refresh();
  changed();
  showToast("Cleared every tick");
}

/* ---------- boot ---------- */
const app = document.getElementById("app");
if (!app) return;
const state = readState();
try { localStorage.setItem(STORE_KEY + ":test", "1"); localStorage.removeItem(STORE_KEY + ":test"); } catch (e) { canSave = false; }
app.innerHTML = appHTML(state);
applyHide(readHide());
setStatus();
track("view", state.savedAt ? progressSummary() : null);

app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains("tick")) {
    const id = t.getAttribute("data-id");
    if (!VALID.has(id)) return;
    if (t.checked) state.done.add(id); else state.done.delete(id);
    const li = t.closest(".item");
    if (li) li.classList.toggle("is-done", t.checked);
    refresh();
    changed();
  } else if (t.name === "spec") {
    if (!BUILDS[t.value]) return;
    state.spec = t.value;
    const slot = document.getElementById("build-slot");
    if (slot) slot.innerHTML = buildHTML(BUILDS[t.value]);
    changed();
  } else if (t.id === "hide-done") {
    writeHide(t.checked);
    applyHide(t.checked);
  }
});

app.addEventListener("click", (e) => {
  const coord = e.target.closest(".coord");
  if (coord) { copyWay(coord.getAttribute("data-way")); return; }
  const reset = e.target.closest("#reset-btn");
  if (reset) onReset(reset);
});

window.addEventListener("storage", (e) => {
  if (e.key !== STORE_KEY) return;
  const next = readState();
  state.done = next.done;
  state.spec = next.spec;
  state.savedAt = next.savedAt;
  app.innerHTML = appHTML(state);
  applyHide(readHide());
  setStatus();
});

if (/^#[A-Za-z0-9._~-]+$/.test(location.hash)) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) requestAnimationFrame(() => target.scrollIntoView());
}

})();
</script>
</body>
</html>
