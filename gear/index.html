<style>
:root{color-scheme:light}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
:root{
  --bg:#EDF0F3;
  --surface:#FBFCFD;
  --surface-2:#E4E9EE;
  --ink:#15202B;
  --ink-2:#465465;
  --ink-3:#5E6C7B;
  --line:#D2D9E1;
  --line-strong:#A9B5C2;
  --accent:#0A62C9;
  --on-color:#FFFFFF;
  --earth:#8A591A;
  --earth-soft:#F0E3CF;
  --fire:#B03A0C;
  --fire-soft:#F7DFD2;
  --water:#0B7285;
  --water-soft:#D4EDF1;
  --ok:#2C7A4B;
  --warn:#9A5B00;
  --warn-soft:#F6E7CC;
  --focus:#0A62C9;
  --q-rare:#005EBD;
  --q-unc:#1F7A1F;
  --q-com:#15202B;
  --font-display:"Marcellus SC","Marcellus",Georgia,"Times New Roman",serif;
  --font-body:"Alegreya Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

    color-scheme:dark;

    --ink-3:#8793A0;
    --line:#28323D;

    --accent:#5AA9FF;
    --on-color:#0B1520;
    --earth:#D9A962;
    --earth-soft:#33281A;
    --fire:#FF8C57;
    --fire-soft:#3B2319;
    --water:#45C7D9;
    --water-soft:#12323A;
    --ok:#6FD39A;
    --warn:#F2B35B;
    --warn-soft:#3A2A12;
    --focus:#5AA9FF;
    --q-rare:#4DA3FF;
    --q-unc:#5DD86A;
    --q-com:#E6EBF0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141A;
  --surface:#161D25;
  --surface-2:#1E2731;
  --ink:#E6EBF0;
  --ink-2:#A5B1BE;
  --ink-3:#8793A0;
  --line:#28323D;
  --line-strong:#3A4755;
  --accent:#5AA9FF;
  --on-color:#0B1520;
  --earth:#D9A962;
  --earth-soft:#33281A;
  --fire:#FF8C57;
  --fire-soft:#3B2319;
  --water:#45C7D9;
  --water-soft:#12323A;
  --ok:#6FD39A;
  --warn:#F2B35B;
  --warn-soft:#3A2A12;
  --focus:#5AA9FF;
  --q-rare:#4DA3FF;
  --q-unc:#5DD86A;
  --q-com:#E6EBF0;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:where(a,button,summary):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[data-el="earth"]{--el:var(--earth);--el-soft:var(--earth-soft)}
[data-el="fire"]{--el:var(--fire);--el-soft:var(--fire-soft)}
[data-el="water"]{--el:var(--water);--el-soft:var(--water-soft)}
#app{--spec:var(--earth);--spec-soft:var(--earth-soft)}
#app[data-spec="ele"]{--spec:var(--fire);--spec-soft:var(--fire-soft)}
#app[data-spec="resto"]{--spec:var(--water);--spec-soft:var(--water-soft)}

/* Layout */
.shell{max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px);padding-block:28px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.rail{display:contents}
.sections{display:grid;gap:22px;min-width:0;container-type:inline-size}
@media (min-width:960px){
  .shell{grid-template-columns:300px minmax(0,1fr);column-gap:40px;align-items:start}
  .rail{display:flex;flex-direction:column;gap:22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 40px);overflow-y:auto;padding-bottom:8px;scrollbar-width:thin}
}

/* Nameplate */
.plate{display:grid;gap:10px}
.eyebrow{margin:0;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.plate h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(32px,4vw,40px);line-height:1.04;letter-spacing:.005em;text-wrap:balance}
.lede{margin:0;color:var(--ink-2);max-width:44ch}
.companion{margin:0;font-size:14.5px;color:var(--ink-2)}
.rail-title{margin:0;padding:0;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* Build switch */
.specbar{margin:0;padding:0;border:0;min-width:0;display:grid;gap:8px}
.seg-list{display:grid;gap:6px}
.seg{position:relative;display:block;cursor:pointer}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg-body{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:background .12s,border-color .12s}
.seg-glyph{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--el-soft);color:var(--el);transition:background .12s,color .12s}
.seg-glyph svg{width:15px;height:15px}
.seg-text{flex:1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 8px;min-width:0}
.seg-name{font-family:var(--font-display);font-size:17px;line-height:1.2}
.seg-short{display:none;font-family:var(--font-display);font-size:16px;line-height:1.15}
.seg-use{font-size:13px;line-height:1.3;color:var(--ink-2)}
.seg:hover .seg-body{border-color:var(--line-strong)}
.seg input:checked + .seg-body{border-color:var(--el);background:var(--el-soft)}
.seg input:checked + .seg-body .seg-glyph{background:var(--el);color:var(--on-color)}
.seg input:checked + .seg-body .seg-name,.seg input:checked + .seg-body .seg-short{color:var(--el)}
.seg input:focus-visible + .seg-body{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:959.98px){
  .specbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:calc(-1 * clamp(16px,3vw,32px));padding:8px clamp(16px,3vw,32px);background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .specbar .rail-title{display:none}
  .seg-list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .seg-body{justify-content:center;gap:8px;padding:7px 8px}
  .seg-glyph{width:24px;height:24px;border-radius:7px}
  .seg-glyph svg{width:14px;height:14px}
  .seg-text{flex:0 1 auto}
  .seg-name,.seg-use{display:none}
  .seg-short{display:block}
}

/* Professions */
.profs{margin:0;padding:0;border:0;min-width:0;display:grid;gap:8px}
.prof-list{display:flex;flex-wrap:wrap;gap:6px}
.pchip{position:relative;display:inline-flex;cursor:pointer}
.pchip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.pchip span{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:99px;background:var(--surface);font-size:14.5px;line-height:1.2;color:var(--ink-2);transition:background .12s,border-color .12s,color .12s}
.pchip span::before{content:"";flex:none;width:11px;height:11px;border-radius:3px;border:1.5px solid var(--line-strong);background:var(--surface);transition:background .12s,border-color .12s}
.pchip:hover span{border-color:var(--spec)}
.pchip input:checked + span{border-color:var(--spec);background:var(--spec-soft);color:var(--spec)}
.pchip input:checked + span::before{border-color:var(--spec);background:var(--spec)}
.pchip input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.rail-hint{margin:0;font-size:13.5px;line-height:1.4;color:var(--ink-3)}

/* Character sheet */
.doll{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:4px 10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.doll-col{display:grid;gap:4px;align-content:start}
.doll-mid{display:grid;align-content:center;justify-items:center;gap:6px;text-align:center;min-width:0}
.doll-spec{margin:0;font-family:var(--font-display);font-size:18px;line-height:1.1;color:var(--spec)}
.doll-num{margin:0;font-family:var(--font-mono);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.doll-of{font-size:16px;color:var(--ink-3)}
.doll-cap{margin:0;font-size:13.5px;line-height:1.3;color:var(--ink-2);max-width:14ch}
.doll-mid .bar{width:100%;max-width:120px}
.doll-bottom{grid-column:1 / -1;display:flex;justify-content:center;gap:4px;padding-top:4px}
.tile{display:grid;place-items:center;width:62px;height:27px;padding:0;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;transition:background .12s,border-color .12s,color .12s}
button.tile:hover{border-color:var(--spec);color:var(--ink)}
.tile[data-state="have"]{background:var(--spec);border-color:var(--spec);color:var(--on-color)}
.tile[data-state="none"]{border-style:dotted;background:transparent;color:var(--ink-3)}
.tile[data-state="off"]{border-style:dashed;border-color:var(--line);background:transparent;color:var(--ink-3);cursor:default}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--spec);border-radius:inherit;transition:width .25s ease}
.status{margin:0;display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--ink-2)}
.status::before{content:"";flex:none;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--ok)}
.status[data-tone="busy"]::before{background:var(--accent)}
.status[data-tone="warn"]::before{background:var(--warn)}
.status[data-tone="off"]::before{background:var(--line-strong)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.panel-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.glyph{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--spec-soft);color:var(--spec)}
.glyph svg{width:20px;height:20px}
.panel-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:23px;line-height:1.15;text-wrap:balance}
.panel-count{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.pad{display:grid;gap:14px;padding:16px 20px 20px;min-width:0}
.pad > p{margin:0;max-width:70ch}
.intro{color:var(--ink-2)}
.sub{margin:10px 0 0;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.2}
.sub:first-child{margin-top:0}
.chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:11.5px;line-height:1;padding:4px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip-prof{border-color:transparent;background:var(--spec-soft);color:var(--spec)}
.chip-ah{border-style:dashed;border-color:var(--line-strong)}
.chip-stretch{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip-new{border-color:transparent;background:var(--spec-soft);color:var(--spec)}

/* Talents */
.talents{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.talents li{display:inline-flex;align-items:baseline;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;font-size:14.5px;line-height:1.3}
.talents li.is-key{border-color:var(--spec);background:var(--spec-soft);color:var(--spec)}
.t-pts{font-family:var(--font-mono);font-size:12.5px;font-weight:500;color:var(--ink-3)}
.talents li.is-key .t-pts{color:var(--spec)}
.blurb{color:var(--ink)}
.weights{display:grid;gap:7px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.weights-title{margin:0 0 2px;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.w-row{display:grid;grid-template-columns:118px minmax(0,1fr) 44px;align-items:center;gap:10px}
.w-name{font-size:15px}
.w-track{display:block;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.w-track i{display:block;height:100%;border-radius:inherit;background:var(--spec)}
.w-val{font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Set box */
.setbox{display:grid;gap:8px;padding:12px 16px;border:1px solid var(--spec);border-radius:12px;background:var(--spec-soft)}
.setbox-title{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;font-family:var(--font-display);font-size:18px;color:var(--spec)}
.setbox-count{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.setbox-pieces{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.setbox-pieces li{padding:4px 10px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px}
.setbox-pieces li.is-have{border-color:var(--spec);color:var(--spec)}
.setbox-pieces li.is-have::before{content:"✓ "}
.setbox-bonus{margin:0;font-size:14.5px;color:var(--ink)}

/* Slot rows */
.slots{list-style:none;margin:0;padding:0 8px 8px;border-top:1px solid var(--line)}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"label have" "main main";gap:6px 14px;padding:14px 12px;border-top:1px solid var(--line);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.slot:first-child{border-top:0}
.slot-label{grid-area:label;align-self:center;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.slot-main{grid-area:main;min-width:0;display:grid;gap:4px}
.have{grid-area:have;display:inline-flex;align-items:center;gap:8px;align-self:start;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tick{appearance:none;-webkit-appearance:none;margin:0;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-content:center;cursor:pointer;transition:background .12s,border-color .12s}
.tick::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--on-color);border-bottom:2.5px solid var(--on-color);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .12s ease}
.tick:hover{border-color:var(--spec)}
.tick:checked{background:var(--spec);border-color:var(--spec)}
.tick:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.tick:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.slot.is-have{background:linear-gradient(90deg,var(--spec-soft),transparent 70%)}
.slot.is-have .have{color:var(--spec)}
.slot.is-flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background-color:var(--spec-soft)}100%{background-color:transparent}}
.item-line{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.item{font-size:17.5px;font-weight:500;line-height:1.3;text-decoration:none}
.item:hover{text-decoration:underline}
.q-r{color:var(--q-rare)}
.q-u{color:var(--q-unc)}
.q-c{color:var(--q-com)}
.item-type{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.stats{margin:0;display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--ink-3);font-variant-numeric:tabular-nums}
.st.hi{color:var(--ink);font-weight:500}
.st.hi::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--spec);vertical-align:1px}
.st.fx{font-family:var(--font-body);font-size:14px;color:var(--ink-2)}
.src{margin:2px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.src .chip{margin-right:7px;vertical-align:1px}
.why{margin:2px 0 0;font-size:15px;line-height:1.45;color:var(--ink);max-width:66ch}
.none{margin:0;font-size:15px;color:var(--ink-3)}
.ups,.alts{list-style:none;margin:6px 0 0;padding:8px 0 0;border-top:1px dashed var(--line);display:grid;gap:7px}
.ups li,.alts li{display:block;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.ups + .alts{border-top:0;padding-top:0}
.alt-k{margin-right:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.up-k{margin-right:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--spec);white-space:nowrap}
.alt-body{display:inline}
.alt-body > * + *{margin-left:8px}
.alt-item{font-weight:500;text-decoration:none}
.alt-item:hover{text-decoration:underline}
.alt-src{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.alt-stats{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.alt-why{display:block}
@container (min-width:620px){
  .slot{grid-template-columns:104px minmax(0,1fr) auto;grid-template-areas:"label main have"}
  .slot-label{align-self:start;padding-top:5px}
  .ups li,.alts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;align-items:baseline}
  .alt-k,.up-k{margin-right:0}
  .alt-body{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;min-width:0}
  .alt-body > * + *{margin-left:0}
  .alt-why{grid-column:2}
}

/* Enchants */
.ench{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ench li{display:grid;grid-template-columns:minmax(0,1fr);gap:3px 16px;padding:12px 14px;border-top:1px solid var(--line)}
.ench li:first-child{border-top:0}
.ench-slot{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ench-main{display:grid;gap:2px;min-width:0}
.ench-name{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:500;font-size:16px}
.ench-fx{margin:0;font-family:var(--font-mono);font-size:13px;color:var(--ink)}
.ench-how{margin:0;font-size:14.5px;color:var(--ink-2)}
@container (min-width:620px){
  .ench li{grid-template-columns:150px minmax(0,1fr)}
  .ench-slot{padding-top:3px}
}

/* Where to get it */
.where-grid{display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.where-card{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 18px;padding:12px 14px;border-top:1px solid var(--line)}
.where-card:first-child{border-top:0}
.where-head{display:grid;gap:3px;align-content:start;min-width:0}
.where-title{margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--font-display);font-size:17px;line-height:1.2}
.where-count{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.where-where{margin:0;font-size:14px;line-height:1.4;color:var(--ink-3)}
.where-items{list-style:none;margin:0;padding:0;display:grid;gap:3px;align-content:start;font-size:14.5px;line-height:1.35}
.where-items li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px;align-items:baseline}
.where-items li::before{content:"";width:8px;height:8px;border-radius:2px;border:1.5px solid var(--line-strong)}
.where-items li.is-have{color:var(--ink-3)}
.where-items li.is-have::before{border-color:var(--spec);background:var(--spec)}
.where-items li.is-have span{text-decoration:line-through;text-decoration-color:var(--line-strong)}
.choices{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.choices li{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 16px;padding:12px 14px;border-top:1px solid var(--line)}
.choices li:first-child{border-top:0}
.ch-q{margin:0;font-weight:500}
.ch-where{margin:0;font-size:14px;color:var(--ink-3)}
.ch-pick{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.ch-take{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--spec)}
.ch-why{margin:0;font-size:14.5px;color:var(--ink-2)}
@container (min-width:560px){
  .where-card{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
  .choices li{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
  .ch-right{display:grid;gap:3px;align-content:start}
}

/* Notes */
.callout{padding:10px 14px;border-radius:10px;background:var(--spec-soft);color:var(--ink)}
.wild,.out,.plain{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.wild li{display:grid;gap:2px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:12px}
.wild-note{margin:0;font-size:14.5px;color:var(--ink-2)}
.out{gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.out li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.4}
.out li:first-child{border-top:0}
.out-name{font-weight:500;color:var(--ink)}
.out-why{color:var(--ink-2)}
.out-items{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-3)}
@container (min-width:620px){
  .out li{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
  .out-items{grid-column:2}
}
.plain{gap:6px}
.plain li{position:relative;padding-left:16px;font-size:15px;color:var(--ink-2)}
.plain li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--line-strong)}

/* Footer */
.foot{display:grid;gap:10px;padding:6px 4px 0;font-size:14.5px;color:var(--ink-2)}
.foot p{margin:0;max-width:72ch}
.foot .rail-title{margin-top:8px}
.whoami{margin-top:4px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:15px}
.whoami:empty{display:none}
.sources{margin:0;padding-left:18px;display:grid;gap:4px}
.sources span{color:var(--ink-3)}
.reset-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px}
.reset{padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);cursor:pointer}
.reset:hover{border-color:var(--fire);color:var(--fire)}
.reset.armed{border-color:var(--fire);background:var(--fire-soft);color:var(--fire)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

const STAT_ORDER = [["str", "Str"], ["agi", "Agi"], ["sta", "Sta"], ["int", "Int"], ["spi", "Spi"], ["ap", "attack power"], ["sp", "spell power"], ["heal", "healing"], ["dmg", "spell damage"], ["mp5", "mp5"], ["hp5", "hp5"]];

/* ---------- helpers ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pct(d, t) { return t ? Math.round((d / t) * 100) : 0; }
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  try { return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  catch (e) { return d.toISOString().slice(0, 16).replace("T", " "); }
}
function itemLink(key, cls) {
  const it = ITEMS[key];
  return '<a class="' + cls + " q-" + it.q + '" href="' + WH + it.id + '" target="_blank" rel="noopener">' + esc(it.n) + "</a>";
}
function statParts(it, spec) {
  const w = WEIGHT[spec] || {};
  const parts = [];
  if (it.w) parts.push({ t: it.w[0] + "–" + it.w[1] + " damage · " + it.w[2] + " speed · " + it.w[3] + " DPS", hi: spec === "enh" });
  STAT_ORDER.forEach((p) => {
    const v = it.s && it.s[p[0]];
    if (v) parts.push({ t: "+" + v + " " + p[1], hi: (w[p[0]] || 0) >= 0.5 });
  });
  (it.fx || []).forEach((f) => parts.push({ t: f, fx: true }));
  return parts;
}
function statsHTML(it, spec) {
  return '<p class="stats">' + statParts(it, spec).map((p) => '<span class="st' + (p.hi ? " hi" : "") + (p.fx ? " fx" : "") + '">' + esc(p.t) + "</span>").join("") + "</p>";
}
function statsShort(it, spec) {
  const out = [];
  if (it.w && spec === "enh") out.push(it.w[3] + " DPS");
  STAT_ORDER.forEach((p) => { const v = it.s && it.s[p[0]]; if (v) out.push("+" + v + " " + p[1]); });
  return out.join(", ");
}
function srcShort(it) {
  const m = SRC[it.src.k];
  return m.chip + (it.src.skill ? " " + it.src.skill : "");
}
function srcChips(it) {
  const k = it.src.k;
  const m = SRC[k];
  let h = '<span class="chip' + (m.prof ? " chip-prof" : "") + (k === "boe" || k === "rare" ? " chip-ah" : "") + '">' + esc(srcShort(it)) + "</span>";
  if (m.stretch) h += '<span class="chip chip-stretch">Stretch</span>';
  return h;
}
function srcText(it) {
  const s = it.src;
  switch (s.k) {
    case "dm": case "wc": case "hot": case "rol": case "sfk": return "Drops from " + s.by + ".";
    case "dmq": case "wcq": case "hotq": case "rolq": case "bfdq": case "zq": return "Quest: " + s.quest + ". " + s.how + ".";
    case "lib": return "Friend of the Library: hand in 10 library books to Garion Wendell in Stormwind’s Mage Quarter.";
    case "boe": return "Bind on Equip. " + s.by + ".";
    case "rare": return "Drops from " + s.by + ". Bind on Equip.";
    case "lw": return "Pattern from Daniel Stitchsong at Three Corners, Redridge, for 30 Merchant’s Favor. Bind on Pickup, so only the crafter can wear it.";
    case "tail": return "Pattern from Mivin Shadowweave at Three Corners, Redridge, for 30 Merchant’s Favor. Bind on Pickup, so only the crafter can wear it.";
    case "eng": return "Only engineers can equip it.";
    case "ench": return "Formula from Alynsia at Three Corners, Redridge, for 45 Merchant’s Favor. Bind on Pickup, so only the enchanter can equip it.";
  }
  return "";
}
function parseOpt(o) {
  const i = o.indexOf(":");
  return i < 0 ? { k: o, p: null } : { k: o.slice(0, i), p: o.slice(i + 1) };
}
function isAvail(o, st) { return !o.p || st.profs.has(o.p); }

/* ---------- rows ---------- */
function computeRows(st) {
  const spec = SPECS[st.spec];
  const rows = [];
  spec.slots.forEach((slot) => {
    const opts = slot.opts.map(parseOpt);
    const avail = opts.filter((o) => isAvail(o, st));
    const n = slot.pair ? 2 : 1;
    const picks = avail.slice(0, n).map((o) => o.k);
    let cut = opts.length;
    if (picks.length === n) cut = opts.findIndex((o) => o.k === picks[n - 1]);
    const ups = opts.slice(0, cut).filter((o) => !isAvail(o, st));
    const alts = [];
    avail.slice(n).forEach((o) => alts.push([o.k, (slot.why && slot.why[o.k]) || ""]));
    (slot.alts || []).forEach((a) => {
      if (picks.indexOf(a[0]) === -1 && !alts.some((x) => x[0] === a[0])) alts.push(a);
    });
    for (let i = 0; i < n; i++) {
      rows.push({
        slot: slot,
        rid: "row-" + slot.key + (slot.pair ? "-" + (i + 1) : ""),
        label: slot.label + (slot.pair ? " " + (i + 1) : ""),
        item: picks[i] || null,
        ups: i === n - 1 ? ups : [],
        alts: i === n - 1 ? alts : []
      });
    }
  });
  return rows;
}
function ownedCount(st, rows) {
  const withItem = rows.filter((r) => r.item);
  return { have: withItem.filter((r) => st.have.has(r.item)).length, total: withItem.length };
}

/* ---------- state (saved in this browser) ---------- */
const STORE_KEY = "forever-shaman20:gear:v1";
let canSave = true;
function readState() {
  const st = { have: new Set(), profs: new Set(), spec: "enh", savedAt: null };
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const p = raw ? JSON.parse(raw) : null;
    if (p && Array.isArray(p.have)) p.have.forEach((k) => { if (ITEMS[k]) st.have.add(k); });
    if (p && Array.isArray(p.profs)) p.profs.forEach((k) => { if (PROF_NAME[k]) st.profs.add(k); });
    if (p && SPECS[p.spec]) st.spec = p.spec;
    if (p && typeof p.savedAt === "string") st.savedAt = p.savedAt;
  } catch (e) { /* start fresh */ }
  return st;
}
function save() {
  const savedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, have: Array.from(state.have).sort(), profs: Array.from(state.profs).sort(), spec: state.spec, savedAt: savedAt }));
    state.savedAt = savedAt;
    canSave = true;
  } catch (e) { canSave = false; }
  setStatus();
}
function setStatus() {
  const el = document.getElementById("save-status");
  if (!el) return;
  let text = "Your ticks and choices save in this browser.";
  let tone = "ok";
  if (!canSave) { text = "This browser won’t let the page save, so changes last until you close the tab. Private windows often do this."; tone = "warn"; }
  else if (state.savedAt) text = "Saved in this browser " + fmtTime(state.savedAt) + ".";
  el.textContent = text;
  el.setAttribute("data-tone", tone);
}
function changed() { save(); track("state", progressSummary()); }

/* ---------- visit stats (see /assets/track.js) ---------- */
function track(kind, data) { try { if (window.shamanTrack) window.shamanTrack(kind, data); } catch (e) { /* stats are optional */ } }
function progressSummary() {
  const c = ownedCount(state, computeRows(state));
  return { spec: state.spec, have: c.have, total: c.total, profs: Array.from(state.profs) };
}

/* ---------- live updates ---------- */
function renderAll() {
  app.setAttribute("data-spec", state.spec);
  app.innerHTML = appHTML(state);
}
function renderBuild() {
  app.setAttribute("data-spec", state.spec);
  const rows = computeRows(state);
  const main = document.getElementById("main");
  const doll = document.getElementById("doll-slot");
  if (main) main.innerHTML = mainHTML(state, rows);
  if (doll) doll.innerHTML = dollHTML(state, rows);
}
function refreshOwned() {
  const rows = computeRows(state);
  const c = ownedCount(state, rows);
  const doll = document.getElementById("doll-slot");
  if (doll) doll.innerHTML = dollHTML(state, rows);
  const where = document.getElementById("where-slot");
  if (where) where.innerHTML = whereHTML(state, rows);
  const set = document.getElementById("set-slot");
  if (set) set.innerHTML = setHTML(state);
  const count = document.getElementById("gear-count");
  if (count) count.textContent = c.have + "/" + c.total + " owned";
}

let flashTimer = 0;
function goTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  app.querySelectorAll(".slot.is-flash").forEach((n) => n.classList.remove("is-flash"));
  el.classList.add("is-flash");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove("is-flash"), 1500);
}

let resetArmed = false;
let resetTimer = 0;
function onReset(btn) {
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = "Tap again to clear every tick";
    btn.classList.add("armed");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = "Clear all ticks"; btn.classList.remove("armed"); }, 4000);
    return;
  }
  resetArmed = false;
  clearTimeout(resetTimer);
  btn.textContent = "Clear all ticks";
  btn.classList.remove("armed");
  state.have.clear();
  app.querySelectorAll(".tick").forEach((cb) => {
    cb.checked = false;
    const li = cb.closest(".slot");
    if (li) li.classList.remove("is-have");
  });
  refreshOwned();
  changed();
}

/* ---------- boot ---------- */
const app = document.getElementById("app");
if (!app) return;
const state = readState();
try { localStorage.setItem(STORE_KEY + ":test", "1"); localStorage.removeItem(STORE_KEY + ":test"); } catch (e) { canSave = false; }
const hashSpec = /^#(enh|ele|resto)$/.exec(location.hash);
if (hashSpec) state.spec = hashSpec[1];
renderAll();
setStatus();
track("view", state.savedAt ? progressSummary() : null);

app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains("tick")) {
    const id = t.getAttribute("data-id");
    if (!ITEMS[id]) return;
    if (t.checked) state.have.add(id); else state.have.delete(id);
    const li = t.closest(".slot");
    if (li) li.classList.toggle("is-have", t.checked);
    refreshOwned();
    changed();
  } else if (t.name === "spec") {
    if (!SPECS[t.value]) return;
    state.spec = t.value;
    renderBuild();
    changed();
  } else if (t.hasAttribute && t.hasAttribute("data-prof")) {
    const p = t.getAttribute("data-prof");
    if (!PROF_NAME[p]) return;
    if (t.checked) state.profs.add(p); else state.profs.delete(p);
    renderBuild();
    changed();
  }
});

app.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { goTo(go.getAttribute("data-go")); return; }
  const reset = e.target.closest("#reset-btn");
  if (reset) onReset(reset);
});

window.addEventListener("storage", (e) => {
  if (e.key !== STORE_KEY) return;
  const next = readState();
  state.have = next.have;
  state.profs = next.profs;
  state.spec = next.spec;
  state.savedAt = next.savedAt;
  renderAll();
  setStatus();
});

if (/^#[A-Za-z0-9._~-]+$/.test(location.hash) && !hashSpec) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) requestAnimationFrame(() => target.scrollIntoView());
}

})();
</script>
</body>
</html>
