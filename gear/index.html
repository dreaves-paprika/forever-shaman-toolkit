<style>
:root{color-scheme:light}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
:root{
  --bg:#EDF0F3;
  --surface:#FBFCFD;
  --surface-2:#E4E9EE;
  --ink:#15202B;
  --ink-2:#465465;
  --ink-3:#5E6C7B;
  --line:#D2D9E1;
  --line-strong:#A9B5C2;
  --accent:#0A62C9;
  --on-color:#FFFFFF;
  --earth:#8A591A;
  --earth-soft:#F0E3CF;
  --fire:#B03A0C;
  --fire-soft:#F7DFD2;
  --water:#0B7285;
  --water-soft:#D4EDF1;
  --ok:#2C7A4B;
  --warn:#9A5B00;
  --warn-soft:#F6E7CC;
  --focus:#0A62C9;
  --q-rare:#005EBD;
  --q-unc:#1F7A1F;
  --q-com:#15202B;
  --font-display:"Marcellus SC","Marcellus",Georgia,"Times New Roman",serif;
  --font-body:"Alegreya Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

    color-scheme:dark;
    --bg:#0F141A;

    --surface-2:#1E2731;

    --ink-2:#A5B1BE;
    --ink-3:#8793A0;
    --line:#28323D;
    --line-strong:#3A4755;
    --accent:#5AA9FF;
    --on-color:#0B1520;
    --earth:#D9A962;
    --earth-soft:#33281A;
    --fire:#FF8C57;
    --fire-soft:#3B2319;
    --water:#45C7D9;
    --water-soft:#12323A;
    --ok:#6FD39A;
    --warn:#F2B35B;
    --warn-soft:#3A2A12;
    --focus:#5AA9FF;
    --q-rare:#4DA3FF;
    --q-unc:#5DD86A;
    --q-com:#E6EBF0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141A;
  --surface:#161D25;
  --surface-2:#1E2731;
  --ink:#E6EBF0;
  --ink-2:#A5B1BE;
  --ink-3:#8793A0;
  --line:#28323D;
  --line-strong:#3A4755;
  --accent:#5AA9FF;
  --on-color:#0B1520;
  --earth:#D9A962;
  --earth-soft:#33281A;
  --fire:#FF8C57;
  --fire-soft:#3B2319;
  --water:#45C7D9;
  --water-soft:#12323A;
  --ok:#6FD39A;
  --warn:#F2B35B;
  --warn-soft:#3A2A12;
  --focus:#5AA9FF;
  --q-rare:#4DA3FF;
  --q-unc:#5DD86A;
  --q-com:#E6EBF0;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:where(a,button,summary):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[data-el="earth"]{--el:var(--earth);--el-soft:var(--earth-soft)}
[data-el="fire"]{--el:var(--fire);--el-soft:var(--fire-soft)}
[data-el="water"]{--el:var(--water);--el-soft:var(--water-soft)}
#app{--spec:var(--earth);--spec-soft:var(--earth-soft)}
#app[data-spec="ele"]{--spec:var(--fire);--spec-soft:var(--fire-soft)}
#app[data-spec="resto"]{--spec:var(--water);--spec-soft:var(--water-soft)}

/* Layout */
.shell{max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px);padding-block:28px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.rail{display:contents}
.sections{display:grid;gap:22px;min-width:0;container-type:inline-size}
@media (min-width:960px){
  .shell{grid-template-columns:300px minmax(0,1fr);column-gap:40px;align-items:start}
  .rail{display:flex;flex-direction:column;gap:22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 40px);overflow-y:auto;padding-bottom:8px;scrollbar-width:thin}
}

/* Nameplate */
.plate{display:grid;gap:10px}
.eyebrow{margin:0;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.plate h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(32px,4vw,40px);line-height:1.04;letter-spacing:.005em;text-wrap:balance}
.lede{margin:0;color:var(--ink-2);max-width:44ch}
.companion{margin:0;font-size:14.5px;color:var(--ink-2)}
.rail-title{margin:0;padding:0;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* Build switch */
.specbar{margin:0;padding:0;border:0;min-width:0;display:grid;gap:8px}
.seg-list{display:grid;gap:6px}
.seg{position:relative;display:block;cursor:pointer}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg-body{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:background .12s,border-color .12s}
.seg-glyph{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--el-soft);color:var(--el);transition:background .12s,color .12s}
.seg-glyph svg{width:15px;height:15px}
.seg-text{flex:1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 8px;min-width:0}
.seg-name{font-family:var(--font-display);font-size:17px;line-height:1.2}
.seg-short{display:none;font-family:var(--font-display);font-size:16px;line-height:1.15}
.seg-use{font-size:13px;line-height:1.3;color:var(--ink-2)}
.seg:hover .seg-body{border-color:var(--line-strong)}
.seg input:checked + .seg-body{border-color:var(--el);background:var(--el-soft)}
.seg input:checked + .seg-body .seg-glyph{background:var(--el);color:var(--on-color)}
.seg input:checked + .seg-body .seg-name,.seg input:checked + .seg-body .seg-short{color:var(--el)}
.seg input:focus-visible + .seg-body{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:959.98px){
  .specbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:calc(-1 * clamp(16px,3vw,32px));padding:8px clamp(16px,3vw,32px);background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .specbar .rail-title{display:none}
  .seg-list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .seg-body{justify-content:center;gap:8px;padding:7px 8px}
  .seg-glyph{width:24px;height:24px;border-radius:7px}
  .seg-glyph svg{width:14px;height:14px}
  .seg-text{flex:0 1 auto}
  .seg-name,.seg-use{display:none}
  .seg-short{display:block}
}

/* Professions */
.profs{margin:0;padding:0;border:0;min-width:0;display:grid;gap:8px}
.prof-list{display:flex;flex-wrap:wrap;gap:6px}
.pchip{position:relative;display:inline-flex;cursor:pointer}
.pchip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.pchip span{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:99px;background:var(--surface);font-size:14.5px;line-height:1.2;color:var(--ink-2);transition:background .12s,border-color .12s,color .12s}
.pchip span::before{content:"";flex:none;width:11px;height:11px;border-radius:3px;border:1.5px solid var(--line-strong);background:var(--surface);transition:background .12s,border-color .12s}
.pchip:hover span{border-color:var(--spec)}
.pchip input:checked + span{border-color:var(--spec);background:var(--spec-soft);color:var(--spec)}
.pchip input:checked + span::before{border-color:var(--spec);background:var(--spec)}
.pchip input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.rail-hint{margin:0;font-size:13.5px;line-height:1.4;color:var(--ink-3)}

/* Character sheet */
.doll{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:4px 10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.doll-col{display:grid;gap:4px;align-content:start}
.doll-mid{display:grid;align-content:center;justify-items:center;gap:6px;text-align:center;min-width:0}
.doll-spec{margin:0;font-family:var(--font-display);font-size:18px;line-height:1.1;color:var(--spec)}
.doll-num{margin:0;font-family:var(--font-mono);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.doll-of{font-size:16px;color:var(--ink-3)}
.doll-cap{margin:0;font-size:13.5px;line-height:1.3;color:var(--ink-2);max-width:14ch}
.doll-mid .bar{width:100%;max-width:120px}
.doll-bottom{grid-column:1 / -1;display:flex;justify-content:center;gap:4px;padding-top:4px}
.tile{display:grid;place-items:center;width:62px;height:27px;padding:0;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;transition:background .12s,border-color .12s,color .12s}
button.tile:hover{border-color:var(--spec);color:var(--ink)}
.tile[data-state="have"]{background:var(--spec);border-color:var(--spec);color:var(--on-color)}
.tile[data-state="none"]{border-style:dotted;background:transparent;color:var(--ink-3)}
.tile[data-state="off"]{border-style:dashed;border-color:var(--line);background:transparent;color:var(--ink-3);cursor:default}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--spec);border-radius:inherit;transition:width .25s ease}
.status{margin:0;display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--ink-2)}
.status::before{content:"";flex:none;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--ok)}
.status[data-tone="busy"]::before{background:var(--accent)}
.status[data-tone="warn"]::before{background:var(--warn)}
.status[data-tone="off"]::before{background:var(--line-strong)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.panel-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.glyph{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--spec-soft);color:var(--spec)}
.glyph svg{width:20px;height:20px}
.panel-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:23px;line-height:1.15;text-wrap:balance}
.panel-count{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.pad{display:grid;gap:14px;padding:16px 20px 20px;min-width:0}
.pad > p{margin:0;max-width:70ch}
.intro{color:var(--ink-2)}
.sub{margin:10px 0 0;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.2}
.sub:first-child{margin-top:0}
.chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:11.5px;line-height:1;padding:4px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip-prof{border-color:transparent;background:var(--spec-soft);color:var(--spec)}
.chip-ah{border-style:dashed;border-color:var(--line-strong)}
.chip-stretch{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip-new{border-color:transparent;background:var(--spec-soft);color:var(--spec)}

/* Talents */
.talents{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.talents li{display:inline-flex;align-items:baseline;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;font-size:14.5px;line-height:1.3}
.talents li.is-key{border-color:var(--spec);background:var(--spec-soft);color:var(--spec)}
.t-pts{font-family:var(--font-mono);font-size:12.5px;font-weight:500;color:var(--ink-3)}
.talents li.is-key .t-pts{color:var(--spec)}
.blurb{color:var(--ink)}
.weights{display:grid;gap:7px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.weights-title{margin:0 0 2px;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.w-row{display:grid;grid-template-columns:118px minmax(0,1fr) 44px;align-items:center;gap:10px}
.w-name{font-size:15px}
.w-track{display:block;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.w-track i{display:block;height:100%;border-radius:inherit;background:var(--spec)}
.w-val{font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Set box */
.setbox{display:grid;gap:8px;padding:12px 16px;border:1px solid var(--spec);border-radius:12px;background:var(--spec-soft)}
.setbox-title{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;font-family:var(--font-display);font-size:18px;color:var(--spec)}
.setbox-count{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.setbox-pieces{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.setbox-pieces li{padding:4px 10px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px}
.setbox-pieces li.is-have{border-color:var(--spec);color:var(--spec)}
.setbox-pieces li.is-have::before{content:"✓ "}
.setbox-bonus{margin:0;font-size:14.5px;color:var(--ink)}

/* Slot rows */
.slots{list-style:none;margin:0;padding:0 8px 8px;border-top:1px solid var(--line)}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"label have" "main main";gap:6px 14px;padding:14px 12px;border-top:1px solid var(--line);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.slot:first-child{border-top:0}
.slot-label{grid-area:label;align-self:center;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.slot-main{grid-area:main;min-width:0;display:grid;gap:4px}
.slot-note{margin:6px 0 0}
.slot-note:empty{display:none}
.have{grid-area:have;display:inline-flex;align-items:center;gap:8px;align-self:start;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tick{appearance:none;-webkit-appearance:none;margin:0;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-content:center;cursor:pointer;transition:background .12s,border-color .12s}
.tick::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--on-color);border-bottom:2.5px solid var(--on-color);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .12s ease}
.tick:hover{border-color:var(--spec)}
.tick:checked{background:var(--spec);border-color:var(--spec)}
.tick:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.tick:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.slot.is-have{background:linear-gradient(90deg,var(--spec-soft),transparent 70%)}
.slot.is-have .have{color:var(--spec)}
.slot.is-flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background-color:var(--spec-soft)}100%{background-color:transparent}}
.item-line{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.item{font-size:17.5px;font-weight:500;line-height:1.3;text-decoration:none}
.item:hover{text-decoration:underline}
.q-r{color:var(--q-rare)}
.q-u{color:var(--q-unc)}
.q-c{color:var(--q-com)}
.item-type{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.stats{margin:0;display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--ink-3);font-variant-numeric:tabular-nums}
.st.hi{color:var(--ink);font-weight:500}
.st.hi::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--spec);vertical-align:1px}
.st.fx{font-family:var(--font-body);font-size:14px;color:var(--ink-2)}
.src{margin:2px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.src .chip{margin-right:7px;vertical-align:1px}
.why{margin:2px 0 0;font-size:15px;line-height:1.45;color:var(--ink);max-width:66ch}
.none{margin:0;font-size:15px;color:var(--ink-3)}
.ups,.alts{list-style:none;margin:6px 0 0;padding:8px 0 0;border-top:1px dashed var(--line);display:grid;gap:7px}
.ups li,.alts li{display:block;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.ups + .alts{border-top:0;padding-top:0}
.alt-k{margin-right:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.up-k{margin-right:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--spec);white-space:nowrap}
.alt-body{display:inline}
.alt-body > * + *{margin-left:8px}
.alt-item{font-weight:500;text-decoration:none}
.alt-item:hover{text-decoration:underline}
.alt-src{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.alt-stats{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.alt-why{display:block}
@container (min-width:620px){
  .slot{grid-template-columns:104px minmax(0,1fr) auto;grid-template-areas:"label main have"}
  .slot-label{align-self:start;padding-top:5px}
  .ups li,.alts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;align-items:baseline}
  .alt-k,.up-k{margin-right:0}
  .alt-body{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;min-width:0}
  .alt-body > * + *{margin-left:0}
  .alt-why{grid-column:2}
}

/* Enchants */
.ench{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ench li{display:grid;grid-template-columns:minmax(0,1fr);gap:3px 16px;padding:12px 14px;border-top:1px solid var(--line)}
.ench li:first-child{border-top:0}
.ench-slot{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ench-main{display:grid;gap:2px;min-width:0}
.ench-name{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:500;font-size:16px}
.ench-fx{margin:0;font-family:var(--font-mono);font-size:13px;color:var(--ink)}
.ench-how{margin:0;font-size:14.5px;color:var(--ink-2)}
@container (min-width:620px){
  .ench li{grid-template-columns:150px minmax(0,1fr)}
  .ench-slot{padding-top:3px}
}

/* Where to get it */
.where-grid{display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.where-card{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 18px;padding:12px 14px;border-top:1px solid var(--line)}
.where-card:first-child{border-top:0}
.where-head{display:grid;gap:3px;align-content:start;min-width:0}
.where-title{margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--font-display);font-size:17px;line-height:1.2}
.where-count{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.where-where{margin:0;font-size:14px;line-height:1.4;color:var(--ink-3)}
.where-items{list-style:none;margin:0;padding:0;display:grid;gap:3px;align-content:start;font-size:14.5px;line-height:1.35}
.where-items li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px;align-items:baseline}
.where-items li::before{content:"";width:8px;height:8px;border-radius:2px;border:1.5px solid var(--line-strong)}
.where-items li.is-have{color:var(--ink-3)}
.where-items li.is-have::before{border-color:var(--spec);background:var(--spec)}
.where-items li.is-have span{text-decoration:line-through;text-decoration-color:var(--line-strong)}
.choices{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.choices li{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 16px;padding:12px 14px;border-top:1px solid var(--line)}
.choices li:first-child{border-top:0}
.ch-q{margin:0;font-weight:500}
.ch-where{margin:0;font-size:14px;color:var(--ink-3)}
.ch-pick{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.ch-take{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--spec)}
.ch-why{margin:0;font-size:14.5px;color:var(--ink-2)}
@container (min-width:560px){
  .where-card{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
  .choices li{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
  .ch-right{display:grid;gap:3px;align-content:start}
}

/* Notes */
.callout{padding:10px 14px;border-radius:10px;background:var(--spec-soft);color:var(--ink)}
.wild,.out,.plain{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.wild li{display:grid;gap:2px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:12px}
.wild-note{margin:0;font-size:14.5px;color:var(--ink-2)}
.out{gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.out li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.4}
.out li:first-child{border-top:0}
.out-name{font-weight:500;color:var(--ink)}
.out-why{color:var(--ink-2)}
.out-items{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-3)}
@container (min-width:620px){
  .out li{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
  .out-items{grid-column:2}
}
.plain{gap:6px}
.plain li{position:relative;padding-left:16px;font-size:15px;color:var(--ink-2)}
.plain li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--line-strong)}

/* Footer */
.foot{display:grid;gap:10px;padding:6px 4px 0;font-size:14.5px;color:var(--ink-2)}
.foot p{margin:0;max-width:72ch}
.foot .rail-title{margin-top:8px}
.whoami{margin-top:4px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:15px}
.whoami:empty{display:none}
.sources{margin:0;padding-left:18px;display:grid;gap:4px}
.sources span{color:var(--ink-3)}
.reset-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px}
.reset{padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);cursor:pointer}
.reset:hover{border-color:var(--fire);color:var(--fire)}
.reset.armed{border-color:var(--fire);background:var(--fire-soft);color:var(--fire)}
/* Level switch, sharing and shared builds */
.lvlbar{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;width:max-content;padding:3px;border:1px solid var(--line-strong);border-radius:99px;background:var(--surface)}
.lvl{position:relative;cursor:pointer}
.lvl input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.lvl span{display:block;padding:5px 14px;border-radius:99px;font-family:var(--font-mono);font-size:12.5px;letter-spacing:.04em;color:var(--ink-2);white-space:nowrap;transition:background .12s,color .12s}
.lvl input:checked + span{background:var(--spec);color:var(--on-color)}
.lvl input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.lvl input:disabled{cursor:default}
.preview-note{margin:0;font-size:13.5px;color:var(--warn)}
.share{display:grid;gap:8px}
.share-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border:1px solid var(--spec);border-radius:12px;background:var(--surface);color:var(--spec);font-weight:500;font-size:15px;cursor:pointer;transition:background .12s}
.share-btn:hover{background:var(--spec-soft)}
.share-btn svg{width:16px;height:16px}
.share-note{margin:0;font-size:14px;color:var(--ink-2)}
.share-note:empty{display:none}
.share-url{width:100%;min-width:0;padding:7px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-family:var(--font-mono);font-size:12.5px}
.shared{display:grid;gap:4px;padding:16px 20px;border:1px solid var(--spec);border-radius:16px;background:var(--spec-soft)}
.shared-title{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.15;color:var(--spec)}
.shared-sub{margin:0;font-weight:500}
.shared-hint{margin:0;font-size:14.5px;color:var(--ink-2)}
.shared-back{justify-self:start;margin-top:6px;font-weight:500}
.q-e{color:var(--q-epic,#8E3FD0)}
input:disabled + .seg-body,input:disabled + span{cursor:default}
.tick:disabled{cursor:default}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/gear-data.js"></script>
<script>
(() => {
"use strict";

const CHECKLIST_URL = "/checklist";
const PLANNER_URL = "/dungeons";
const WH = "https://www.wowhead.com/forever/item=";
const NAME_KEY = "forever-shaman20:name";

const GLYPH = {
  earth: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.8 16.6 7 7.2l2.7 4.2 3-5.5 5.5 10.7z" fill="currentColor"/></svg>',
  fire: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10.2 1.6c.5 3 4.8 4.6 4.8 9.4a5 5 0 0 1-10 0c0-2 1-3.5 2.2-4.5.1 1.7.9 2.6 2 3.1-.4-2.8-.1-5.5 1-8z" fill="currentColor"/></svg>',
  water: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.9C7.2 5.8 4.9 8.8 4.9 12a5.1 5.1 0 0 0 10.2 0c0-3.2-2.3-6.2-5.1-10.1z" fill="currentColor"/></svg>',
  rune: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v16M5 5.5l10 9M15 5.5l-10 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  mace: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="13.2" cy="6.8" r="3.6" fill="currentColor"/><path d="m11 9.4-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  spark: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8l1.9 5.3 5.3 1.9-5.3 1.9L10 16.2l-1.9-5.3L2.8 9l5.3-1.9z" fill="currentColor"/></svg>',
  map: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8a5.6 5.6 0 0 0-5.6 5.6c0 4.2 5.6 10.8 5.6 10.8s5.6-6.6 5.6-10.8A5.6 5.6 0 0 0 10 1.8zm0 7.8a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4z" fill="currentColor"/></svg>',
  scroll: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h8l2.5 2.5v12.5H5zM8 7.5h5M8 10.5h5M8 13.5h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  share: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="15" cy="4.8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="15.2" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m7.1 8.9 5.8-3M7.1 11.1l5.8 3" stroke="currentColor" stroke-width="1.6"/></svg>'
};

const G = window.GEAR_DATA;
const { PROFS, PROF_NAME, ITEMS, SRC, GROUPS, WEIGHT, SOURCES, STAT_ORDER, LEVELS } = G;
const SITE = window.SITE || { level: () => 20, levels: () => [20], setLevel: () => {}, onChange: () => {}, preview: false, get: () => null };
const LV = (st) => LEVELS[st.lvl] || LEVELS[20];
const SPEC = (st) => LV(st).specs[st.spec];

/* ---------- helpers ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pct(d, t) { return t ? Math.round((d / t) * 100) : 0; }
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  try { return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  catch (e) { return d.toISOString().slice(0, 16).replace("T", " "); }
}
function cleanName(v) { return String(v || "").replace(/[\u0000-\u001f\u007f<>]/g, "").replace(/\s+/g, " ").trim().slice(0, 40); }
function itemLink(key, cls) {
  const it = ITEMS[key];
  return '<a class="' + cls + " q-" + it.q + '" href="' + WH + it.id + '" target="_blank" rel="noopener">' + esc(it.n) + "</a>";
}
function statParts(it, spec) {
  const w = WEIGHT[spec] || {};
  const parts = [];
  if (it.w) parts.push({ t: it.w[0] + "–" + it.w[1] + " damage · " + it.w[2] + " speed · " + it.w[3] + " DPS", hi: spec === "enh" });
  STAT_ORDER.forEach((p) => {
    const v = it.s && it.s[p[0]];
    if (v) parts.push({ t: "+" + v + " " + p[1], hi: (w[p[0]] || 0) >= 0.5 });
  });
  (it.fx || []).forEach((f) => parts.push({ t: f, fx: true }));
  return parts;
}
function statsHTML(it, spec) {
  return '<p class="stats">' + statParts(it, spec).map((p) => '<span class="st' + (p.hi ? " hi" : "") + (p.fx ? " fx" : "") + '">' + esc(p.t) + "</span>").join("") + "</p>";
}
function statsShort(it, spec) {
  const out = [];
  if (it.w && spec === "enh") out.push(it.w[3] + " DPS");
  STAT_ORDER.forEach((p) => { const v = it.s && it.s[p[0]]; if (v) out.push("+" + v + " " + p[1]); });
  return out.join(", ");
}
function srcShort(it) {
  const m = SRC[it.src.k];
  return m.chip + (it.src.skill ? " " + it.src.skill : "");
}
function srcChips(it, st) {
  const k = it.src.k;
  const m = SRC[k];
  let h = '<span class="chip' + (m.prof ? " chip-prof" : "") + (k === "boe" || k === "rare" || k === "unk" ? " chip-ah" : "") + '">' + esc(srcShort(it)) + "</span>";
  if (m.stretch && m.stretch === st.lvl) h += '<span class="chip chip-stretch">Stretch</span>';
  if (it.src.rare) h += '<span class="chip chip-stretch">Rare spawn</span>';
  if (it.lvl && it.lvl > 20 && st.lvl === 30) h += '<span class="chip">Level ' + it.lvl + "</span>";
  return h;
}
const CRAFT_DEFAULT = {
  lw: "Pattern from Daniel Stitchsong at Three Corners, Redridge, for 30 Merchant’s Favor.",
  tail: "Pattern from Mivin Shadowweave at Three Corners, Redridge, for 30 Merchant’s Favor.",
  ench: "Formula from Alynsia at Three Corners, Redridge, for 45 Merchant’s Favor."
};
function srcText(it) {
  const s = it.src;
  switch (s.k) {
    case "dm": case "wc": case "hot": case "rol": case "sfk": case "bfd": case "stocks": case "gnomer": case "rfk": case "smgy":
      return "Drops from " + s.by + (s.rare ? ", a rare that isn’t there every run" : "") + ".";
    case "dmq": case "wcq": case "hotq": case "rolq": case "bfdq": case "stocksq": case "gnomerq": case "rfkq": case "smq": case "zq":
      return "Quest: " + s.quest + ". " + s.how + ".";
    case "lib": return "Friend of the Library: hand in 10 library books to Garion Wendell in Stormwind’s Mage Quarter.";
    case "boe": return "Bind on Equip. " + s.by + ".";
    case "rare": return "Drops from " + s.by + ". Bind on Equip.";
    case "unk": return "Not confirmed: " + s.by + ".";
    case "lw": case "tail": return (s.pat || CRAFT_DEFAULT[s.k]) + " Bind on Pickup, so only the crafter can wear it.";
    case "eng": return "Only engineers can equip it.";
    case "ench": return (s.pat || CRAFT_DEFAULT.ench) + " Bind on Pickup, so only the enchanter can equip it.";
  }
  return "";
}
function rowsFor(st) { return G.computeRows(st.lvl, st.spec, st.profs); }
function ownedCount(st, rows) {
  const withItem = rows.filter((r) => r.item);
  return { have: withItem.filter((r) => st.have.has(r.item)).length, total: withItem.length };
}

/* ---------- rail ---------- */
function levelbarHTML(st) {
  const levels = shared ? [st.lvl] : SITE.levels();
  if (levels.length < 2) return "";
  return '<div class="lvlbar" role="radiogroup" aria-label="Level cap">'
    + levels.map((l) => '<label class="lvl"><input type="radio" name="lvl" value="' + l + '"' + (l === st.lvl ? " checked" : "") + (shared ? " disabled" : "") + '><span>Level ' + l + "</span></label>").join("")
    + "</div>" + (SITE.preview && st.lvl === 30 ? '<p class="preview-note">Preview: level 30 isn’t live in the beta yet.</p>' : "");
}
function plateHTML(st) {
  const L = LV(st);
  return '<header class="plate"><p class="eyebrow">WoW Forever beta · Dwarf Shaman</p><h1>' + esc(L.title) + "</h1>"
    + levelbarHTML(st)
    + '<p class="lede">' + esc(L.lede) + "</p>"
    + '<p class="companion">Goes with the <a href="' + CHECKLIST_URL + '">' + esc(L.checklistName) + '</a> and the <a href="' + PLANNER_URL + '">dungeon planner</a>.</p></header>';
}
function specbarHTML(st) {
  const specs = LV(st).specs;
  return '<div class="specbar" role="radiogroup" aria-labelledby="specbar-title"><p class="rail-title" id="specbar-title">Talent build</p><div class="seg-list">'
    + Object.keys(specs).map((k) => {
      const s = specs[k];
      return '<label class="seg" data-el="' + s.el + '"><input type="radio" name="spec" id="spec-' + k + '" value="' + k + '"' + (k === st.spec ? " checked" : "") + (shared ? " disabled" : "") + ">"
        + '<span class="seg-body"><span class="seg-glyph">' + GLYPH[s.el] + '</span><span class="seg-text"><span class="seg-name">' + esc(s.label)
        + '</span><span class="seg-short">' + esc(s.short) + '</span><span class="seg-use">' + esc(s.use) + "</span></span></span></label>";
    }).join("") + "</div></div>";
}
function profsHTML(st) {
  return '<div class="profs" role="group" aria-labelledby="profs-title"><p class="rail-title" id="profs-title">' + (shared ? "Their professions" : "Your professions") + '</p><div class="prof-list">'
    + PROFS.map((p) => '<label class="pchip" for="prof-' + p[0] + '"><input type="checkbox" id="prof-' + p[0] + '" data-prof="' + p[0] + '"' + (st.profs.has(p[0]) ? " checked" : "") + (shared ? " disabled" : "") + "><span>" + esc(p[1]) + "</span></label>").join("")
    + '</div><p class="rail-hint">Crafted set pieces are Bind on Pickup, so they only count if you can make them.</p></div>';
}
function tileHTML(t, byId, st) {
  const key = t[0];
  const label = t[1];
  if (!key) return '<span class="tile" data-state="off" title="' + esc(t[2] || "No stats in this slot") + '">' + esc(label) + "</span>";
  const r = byId["row-" + key];
  if (!r) return '<span class="tile" data-state="off">' + esc(label) + "</span>";
  const it = r.item ? ITEMS[r.item] : null;
  const state = !it ? "none" : (st.have.has(r.item) ? "have" : "need");
  const name = r.label + ": " + (it ? it.n + (state === "have" ? ", owned" : ", not owned yet") : "nothing available");
  return '<button type="button" class="tile" data-state="' + state + '" data-go="' + r.rid + '" aria-label="' + esc(name) + '" title="' + esc(name) + '">' + esc(label) + "</button>";
}
function dollHTML(st, rows) {
  const spec = SPEC(st);
  const byId = {};
  rows.forEach((r) => { byId[r.rid] = r; });
  const c = ownedCount(st, rows);
  const left = [["head", "Head"], ["neck", "Neck"], ["shoulder", "Shoulder"], ["back", "Back"], ["chest", "Chest"], [null, "Shirt", "Shirts have no stats"], [null, "Tabard", "Tabards have no stats"], ["wrist", "Wrist"]];
  const right = [["hands", "Hands"], ["waist", "Waist"], ["legs", "Legs"], ["feet", "Feet"], ["ring-1", "Ring"], ["ring-2", "Ring"], ["trinket-1", "Trinket"], ["trinket-2", "Trinket"]];
  const bottom = byId["row-weapon"] ? [["weapon", "2H"], [null, "Off", "Your two-hander fills both hands"], ["relic", "Relic"]] : [["mh", "Main"], ["oh", "Off"], ["relic", "Relic"]];
  const tile = (t) => tileHTML(t, byId, st);
  return '<section class="doll" aria-label="' + (shared ? "Their gear at a glance" : "Your gear at a glance") + '">'
    + '<div class="doll-col">' + left.map(tile).join("") + "</div>"
    + '<div class="doll-mid"><p class="doll-spec">' + esc(spec.label) + '</p><p class="doll-num"><span>' + c.have + '</span><span class="doll-of">/' + c.total + "</span></p>"
    + '<p class="doll-cap">' + (shared ? "best-in-slot pieces they have" : "best-in-slot pieces you have") + '</p><span class="bar" aria-hidden="true"><i style="width:' + pct(c.have, c.total) + '%"></i></span></div>'
    + '<div class="doll-col">' + right.map(tile).join("") + "</div>"
    + '<div class="doll-bottom">' + bottom.map(tile).join("") + "</div></section>";
}
function shareHTML() {
  if (shared) return "";
  return '<div class="share"><button type="button" class="share-btn" id="share-btn">' + GLYPH.share + "Share my build</button>"
    + '<p class="share-note" id="share-note" role="status" aria-live="polite"></p>'
    + '<label class="sr-only" for="share-url">Link to your build</label><input class="share-url" id="share-url" type="text" readonly hidden></div>';
}

/* ---------- panels ---------- */
function panelHead(id, glyph, title, count, countId) {
  return '<div class="panel-head"><span class="glyph">' + GLYPH[glyph] + '</span><h2 id="h-' + id + '">' + esc(title) + "</h2>"
    + (count != null ? '<span class="panel-count"' + (countId ? ' id="' + countId + '"' : "") + ">" + esc(count) + "</span>" : "") + "</div>";
}
function fmtNum(v) { return String(v); }
function sharedHTML(st, rows) {
  if (!shared) return "";
  const c = ownedCount(st, rows);
  const profs = Array.from(st.profs).map((p) => PROF_NAME[p]).join(", ");
  return '<section class="shared" aria-labelledby="shared-title"><p class="shared-title" id="shared-title">' + esc(shared.by ? shared.by + "’s build" : "A shared build") + "</p>"
    + '<p class="shared-sub">Level ' + st.lvl + " " + esc(SPEC(st).label) + (profs ? " · " + esc(profs) : "") + " · " + c.have + " of " + c.total + " best-in-slot pieces</p>"
    + '<p class="shared-hint">This is a read-only copy. Nothing here changes your own tracker.</p>'
    + '<a class="shared-back" href="/gear">Open my own gear guide</a></section>';
}
function talentsHTML(st) {
  const s = SPEC(st);
  const max = Math.max.apply(null, s.weights.map((w) => w[1]));
  return '<section class="panel" id="talents" aria-labelledby="h-talents">' + panelHead("talents", "rune", "What " + s.label + " wants", LV(st).points + " talent points")
    + '<div class="pad"><ul class="talents" aria-label="Key level ' + st.lvl + ' talents">' + s.talents.map((t) => "<li" + (t[2] ? ' class="is-key"' : "") + '><span class="t-name">' + esc(t[0]) + '</span><span class="t-pts">' + esc(t[1]) + "</span></li>").join("") + "</ul>"
    + s.blurb.map((p) => '<p class="blurb">' + esc(p) + "</p>").join("")
    + '<div class="weights"><p class="weights-title">Rough value of one point, in ' + esc(s.unit) + "</p>"
    + s.weights.map((w) => '<div class="w-row"><span class="w-name">' + esc(w[0]) + '</span><span class="w-track" aria-hidden="true"><i style="width:' + Math.round((w[1] / max) * 100) + '%"></i></span><span class="w-val">' + esc(fmtNum(w[1])) + "</span></div>").join("")
    + "</div></div></section>";
}
function setHTML(st) {
  const s = SPEC(st).set;
  if (!s) return "";
  const n = s.pieces.filter((k) => st.have.has(k)).length;
  return '<div class="setbox"><p class="setbox-title"><span>Set: ' + esc(s.name) + '</span><span class="setbox-count">' + n + "/" + s.pieces.length + " owned</span></p>"
    + '<ul class="setbox-pieces">' + s.pieces.map((k) => "<li" + (st.have.has(k) ? ' class="is-have"' : "") + ">" + esc(ITEMS[k].n) + "</li>").join("") + "</ul>"
    + '<p class="setbox-bonus">' + esc(s.bonus) + "</p></div>";
}
function upHTML(o, st) {
  const it = ITEMS[o.k];
  return '<li><span class="up-k">With ' + esc(PROF_NAME[o.p]) + '</span><span class="alt-body">' + itemLink(o.k, "alt-item")
    + '<span class="alt-stats">' + esc(statsShort(it, st.spec)) + "</span></span></li>";
}
function altHTML(a, st) {
  const it = ITEMS[a[0]];
  return '<li><span class="alt-k">Also</span><span class="alt-body">' + itemLink(a[0], "alt-item")
    + '<span class="alt-src">' + esc(srcShort(it)) + '</span><span class="alt-stats">' + esc(statsShort(it, st.spec)) + "</span></span>"
    + (a[1] ? '<span class="alt-why">' + esc(a[1]) + "</span>" : "") + "</li>";
}
function noteBtn(o) { return window.shamanNoteButton ? window.shamanNoteButton(o) : ""; }
function rowHTML(r, st) {
  const slot = r.slot;
  const it = r.item ? ITEMS[r.item] : null;
  const have = !!(it && st.have.has(r.item));
  let main = "";
  if (it) {
    main += '<p class="item-line">' + itemLink(r.item, "item") + '<span class="item-type">' + esc(it.t + (it.set ? " · Viper set" : "")) + "</span></p>";
    main += statsHTML(it, st.spec);
    main += '<p class="src">' + srcChips(it, st) + '<span class="src-text">' + esc(srcText(it)) + "</span></p>";
    const why = slot.why && slot.why[r.item];
    if (why) main += '<p class="why">' + esc(why) + "</p>";
  } else {
    main += '<p class="none">' + esc(slot.none || LV(st).none) + "</p>";
  }
  if (r.ups.length) main += '<ul class="ups">' + r.ups.map((o) => upHTML(o, st)).join("") + "</ul>";
  if (r.alts.length) main += '<ul class="alts">' + r.alts.map((a) => altHTML(a, st)).join("") + "</ul>";
  main += '<p class="slot-note">' + noteBtn({ slot: slot.key, label: r.label, item: it ? it.n : "", kind: "better" }) + "</p>";
  const tick = it
    ? '<label class="have" for="have-' + r.item + '"><input type="checkbox" class="tick" id="have-' + r.item + '" data-id="' + r.item + '"' + (have ? " checked" : "") + (shared ? " disabled" : "") + '><span>' + (shared ? "They have it" : "Have it") + "</span></label>"
    : "";
  return '<li class="slot' + (have ? " is-have" : "") + (it ? "" : " is-none") + '" id="' + r.rid + '"><span class="slot-label">' + esc(r.label) + "</span>"
    + '<div class="slot-main">' + main + "</div>" + tick + "</li>";
}
function gearHTML(st, rows) {
  const s = SPEC(st);
  const c = ownedCount(st, rows);
  return '<section class="panel" id="gear" aria-labelledby="h-gear">' + panelHead("gear", "mace", "Best in slot", c.have + "/" + c.total + " owned", "gear-count")
    + '<div class="pad"><p class="intro">' + esc(LV(st).gearIntro.replace("{spec}", s.label)) + "</p>"
    + (s.set ? '<div id="set-slot">' + setHTML(st) + "</div>" : "") + "</div>"
    + '<ul class="slots">' + rows.map((r) => rowHTML(r, st)).join("") + "</ul></section>";
}
function enchHTML(st) {
  const s = SPEC(st);
  return '<section class="panel" id="enchants" aria-labelledby="h-enchants">' + panelHead("enchants", "spark", "Enchants and kits", null)
    + '<div class="pad"><p class="intro">Enchants and armor kits share one slot on each item, so a kit replaces an enchant. The new Forever formulas cost the enchanter Merchant’s Favor, so ask around before you count on one.</p>'
    + '<ul class="ench">' + s.ench.map((e) => '<li><span class="ench-slot">' + esc(e.slot) + '</span><div class="ench-main"><p class="ench-name"><span>' + esc(e.name) + "</span>"
      + (e.tag ? '<span class="chip chip-new">' + esc(e.tag) + "</span>" : "") + '</p><p class="ench-fx">' + esc(e.fx) + "</p>"
      + (e.how ? '<p class="ench-how">' + esc(e.how) + "</p>" : "") + "</div></li>").join("") + "</ul></div></section>";
}
function whereHTML(st, rows) {
  const buckets = {};
  rows.forEach((r) => {
    if (!r.item) return;
    const g = SRC[ITEMS[r.item].src.k].group;
    (buckets[g] = buckets[g] || []).push(r.item);
  });
  return '<div class="where-grid">' + GROUPS.filter((g) => buckets[g.key]).map((g) => {
    const items = buckets[g.key];
    const have = items.filter((k) => st.have.has(k)).length;
    const where = G.whereText(g, st.lvl);
    return '<div class="where-card"><div class="where-head"><p class="where-title"><span>' + esc(g.title) + '</span><span class="where-count">' + have + "/" + items.length + "</span></p>"
      + (where ? '<p class="where-where">' + esc(where) + "</p>" : "") + "</div>"
      + '<ul class="where-items">' + items.map((k) => "<li" + (st.have.has(k) ? ' class="is-have"' : "") + "><span>" + esc(ITEMS[k].n) + "</span></li>").join("") + "</ul></div>";
  }).join("") + "</div>";
}
function choicesHTML(st) {
  return '<ul class="choices">' + LV(st).choices.map((c) => {
    const p = c.pick[st.spec];
    return '<li><div><p class="ch-q">' + esc(c.q) + '</p><p class="ch-where">' + esc(c.where) + '</p></div><div class="ch-right"><p class="ch-pick"><span class="ch-take">Take</span>'
      + (p[0] ? itemLink(p[0], "alt-item") : "<span>Either</span>") + '</p><p class="ch-why">' + esc(p[1]) + "</p></div></li>";
  }).join("") + "</ul>";
}
function sourcesPanelHTML(st, rows) {
  return '<section class="panel" id="sources" aria-labelledby="h-sources">' + panelHead("sources", "map", "Where to get it", null)
    + '<div class="pad"><p class="intro">' + esc(LV(st).whereIntro) + ' <a href="' + PLANNER_URL + '">Open the dungeon planner</a>.</p>'
    + '<div id="where-slot">' + whereHTML(st, rows) + "</div>"
    + '<h3 class="sub">Quest reward choices</h3><p class="intro">These quests make you pick one reward. Here’s the pick for your build.</p>' + choicesHTML(st) + "</div></section>";
}
function notesHTML(st) {
  const s = SPEC(st);
  const L = LV(st);
  return '<section class="panel" id="notes" aria-labelledby="h-notes">' + panelHead("notes", "scroll", "Notes", null) + '<div class="pad">'
    + '<h3 class="sub">Merchant’s Favor</h3>'
    + "<p>Waylaid Crates drop from ordinary mobs once you’re level 10. Open the label to see what the crate needs, fill it, and hand it to Marcy Baker at Three Corners, Redridge. Your first crate pays 50 Favor; testers report later low-level crates pay about 5 each. Craftsman’s Writs, quests to deliver crafted goods, also pay Favor.</p>"
    + L.favor.map((p) => "<p>" + esc(p) + "</p>").join("")
    + '<p class="callout">' + esc(s.favor) + "</p>"
    + '<h3 class="sub">Library books</h3>'
    + "<p>Friend of the Library needs 10 books, handed in one at a time to Garion Wendell in Stormwind’s Mage Quarter. Books sit on shelves and scroll piles in the world. An Alliance character can reach them at the Tower of Azora (Elwynn), the Hall of Explorers (Ironforge), Moonbrook (Westfall), the Thelsamar or Sentinel Hill inn, Mo’grosh Stronghold (Loch Modan), the Ruins of Mathystra (Darkshore), Duskwood at 16.7, 28.5, Whelgar’s Excavation Site (Wetlands), Ambermill (Silverpine), Sludge Fen and Ratchet (Barrens), the Cavern of Mists near Wailing Caverns, and Grimtotem Post (Stonetalon).</p>"
    + '<h3 class="sub">Worth grabbing if you see them</h3><ul class="wild">'
    + L.wild.map((w) => "<li><span>" + itemLink(w.k, "alt-item") + ' <span class="alt-stats">' + esc(statsShort(ITEMS[w.k], "")) + '</span></span><p class="wild-note">' + esc(w.note) + "</p></li>").join("") + "</ul>"
    + '<h3 class="sub">Left out on purpose</h3><p class="intro">' + esc(L.leftIntro) + '</p><ul class="out">'
    + L.left.map((o) => '<li><span class="out-name">' + esc(o[0]) + '</span><span class="out-why">' + esc(o[1]) + "</span>" + (o[2] ? '<span class="out-items">' + esc(o[2]) + "</span>" : "") + "</li>").join("") + "</ul>"
    + '<h3 class="sub">About this data</h3><ul class="plain">'
    + L.about.map((a) => "<li>" + esc(a) + "</li>").join("")
    + "</ul></div></section>";
}
function footerHTML() {
  return '<footer class="foot"><p>Your ticks, build and professions are saved in this browser and don’t sync between devices. Fan-made and not affiliated with Blizzard Entertainment.</p>'
    + (window.shamanNoteButton ? "<p>Spotted a mistake, or know a better option? " + noteBtn({ link: true, text: "Send a note to the admin" }) + "</p>" : "")
    + '<p><a href="/">Toolkit home</a> · <a href="/checklist">Checklist</a> · <a href="/dungeons">Dungeon planner</a> · <a href="/party">Party board</a></p>'
    + '<div class="whoami" data-whoami></div><h3 class="rail-title">Sources</h3><ul class="sources">'
    + SOURCES.map((s) => '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + "</a> <span>" + esc(s.site) + "</span></li>").join("")
    + "</ul>" + (shared ? "" : '<div class="reset-row"><button type="button" class="reset" id="reset-btn">Clear all ticks</button></div>') + "</footer>";
}
function mainHTML(st, rows) {
  return sharedHTML(st, rows) + talentsHTML(st) + gearHTML(st, rows) + enchHTML(st) + sourcesPanelHTML(st, rows) + notesHTML(st) + footerHTML();
}
function appHTML(st) {
  const rows = rowsFor(st);
  return '<div class="shell"><aside class="rail" aria-label="Build and progress">' + plateHTML(st) + specbarHTML(st) + profsHTML(st)
    + '<div id="doll-slot">' + dollHTML(st, rows) + "</div>" + shareHTML()
    + (shared ? "" : '<p class="status" id="save-status" role="status" aria-live="polite"></p>') + "</aside>"
    + '<main class="sections" id="main">' + mainHTML(st, rows) + "</main></div>";
}

/* ---------- state (saved in this browser) ---------- */
const STORE_KEY = "forever-shaman20:gear:v1";
let canSave = true;
function readState() {
  const st = { have: new Set(), profs: new Set(), spec: "enh", savedAt: null, lvl: SITE.level() };
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const p = raw ? JSON.parse(raw) : null;
    if (p && Array.isArray(p.have)) p.have.forEach((k) => { if (ITEMS[k]) st.have.add(k); });
    if (p && Array.isArray(p.profs)) p.profs.forEach((k) => { if (PROF_NAME[k]) st.profs.add(k); });
    if (p && LEVELS[20].specs[p.spec]) st.spec = p.spec;
    if (p && typeof p.savedAt === "string") st.savedAt = p.savedAt;
  } catch (e) { /* start fresh */ }
  return st;
}
function save() {
  if (shared) return;
  const savedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, have: Array.from(state.have).sort(), profs: Array.from(state.profs).sort(), spec: state.spec, savedAt: savedAt }));
    state.savedAt = savedAt;
    canSave = true;
  } catch (e) { canSave = false; }
  setStatus();
}
function setStatus() {
  const el = document.getElementById("save-status");
  if (!el) return;
  let text = "Your ticks and choices save in this browser.";
  let tone = "ok";
  if (!canSave) { text = "This browser won’t let the page save, so changes last until you close the tab. Private windows often do this."; tone = "warn"; }
  else if (state.savedAt) text = "Saved in this browser " + fmtTime(state.savedAt) + ".";
  el.textContent = text;
  el.setAttribute("data-tone", tone);
}
function changed() { save(); track("state", progressSummary()); }

/* ---------- visit stats (see /assets/track.js) ---------- */
function track(kind, data) { try { if (window.shamanTrack) window.shamanTrack(kind, data); } catch (e) { /* stats are optional */ } }
function progressSummary() {
  const c = ownedCount(state, rowsFor(state));
  return { lvl: state.lvl, spec: state.spec, have: c.have, total: c.total, profs: Array.from(state.profs), own: Array.from(state.have).slice(0, 60) };
}

/* ---------- sharing ---------- */
function shareURL() {
  const q = new URLSearchParams();
  q.set("share", "1");
  q.set("lvl", String(state.lvl));
  q.set("spec", state.spec);
  if (state.profs.size) q.set("profs", Array.from(state.profs).sort().join("."));
  const own = Array.from(state.have).filter((k) => /^[a-z0-9]+$/.test(k)).sort();
  if (own.length) q.set("have", own.join("."));
  const name = cleanName(SITE.get(NAME_KEY));
  if (name) q.set("by", name);
  return location.origin + "/gear?" + q.toString();
}
function readShared() {
  const q = new URLSearchParams(location.search);
  if (q.get("share") !== "1") return null;
  const st = { have: new Set(), profs: new Set(), spec: "enh", savedAt: null, lvl: q.get("lvl") === "30" ? 30 : 20 };
  if (LEVELS[20].specs[q.get("spec")]) st.spec = q.get("spec");
  (q.get("profs") || "").split(".").forEach((p) => { if (PROF_NAME[p]) st.profs.add(p); });
  (q.get("have") || "").split(".").forEach((k) => { if (ITEMS[k]) st.have.add(k); });
  return { st: st, by: cleanName(q.get("by")) };
}
async function onShare(btn) {
  const url = shareURL();
  const note = document.getElementById("share-note");
  const input = document.getElementById("share-url");
  const title = "My level " + state.lvl + " " + SPEC(state).label + " shaman build";
  try {
    if (navigator.share && window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
      await navigator.share({ title: title, url: url });
      if (note) note.textContent = "Shared.";
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  let copied = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(url); copied = true; }
  } catch (e) { copied = false; }
  if (input) { input.hidden = false; input.value = url; if (!copied) { input.focus(); input.select(); } }
  if (note) note.textContent = copied ? "Link copied. Paste it anywhere to show your build." : "Copy this link to share your build:";
  btn.blur();
}

/* ---------- live updates ---------- */
function renderAll() {
  app.setAttribute("data-spec", state.spec);
  document.title = shared ? (shared.by ? shared.by + "’s build · " : "Shared build · ") + LV(state).title : LV(state).title;
  app.innerHTML = appHTML(state);
  setStatus();
}
function renderBuild() {
  app.setAttribute("data-spec", state.spec);
  const rows = rowsFor(state);
  const main = document.getElementById("main");
  const doll = document.getElementById("doll-slot");
  if (main) main.innerHTML = mainHTML(state, rows);
  if (doll) doll.innerHTML = dollHTML(state, rows);
}
function refreshOwned() {
  const rows = rowsFor(state);
  const c = ownedCount(state, rows);
  const doll = document.getElementById("doll-slot");
  if (doll) doll.innerHTML = dollHTML(state, rows);
  const where = document.getElementById("where-slot");
  if (where) where.innerHTML = whereHTML(state, rows);
  const set = document.getElementById("set-slot");
  if (set) set.innerHTML = setHTML(state);
  const count = document.getElementById("gear-count");
  if (count) count.textContent = c.have + "/" + c.total + " owned";
}

let flashTimer = 0;
function goTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  app.querySelectorAll(".slot.is-flash").forEach((n) => n.classList.remove("is-flash"));
  el.classList.add("is-flash");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove("is-flash"), 1500);
}

let resetArmed = false;
let resetTimer = 0;
function onReset(btn) {
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = "Tap again to clear every tick";
    btn.classList.add("armed");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = "Clear all ticks"; btn.classList.remove("armed"); }, 4000);
    return;
  }
  resetArmed = false;
  clearTimeout(resetTimer);
  btn.textContent = "Clear all ticks";
  btn.classList.remove("armed");
  state.have.clear();
  app.querySelectorAll(".tick").forEach((cb) => {
    cb.checked = false;
    const li = cb.closest(".slot");
    if (li) li.classList.remove("is-have");
  });
  refreshOwned();
  changed();
}

/* ---------- boot ---------- */
const app = document.getElementById("app");
if (!app) return;
const shared = readShared();
const state = shared ? shared.st : readState();
if (!shared) {
  try { localStorage.setItem(STORE_KEY + ":test", "1"); localStorage.removeItem(STORE_KEY + ":test"); } catch (e) { canSave = false; }
  const hashSpec = /^#(enh|ele|resto)$/.exec(location.hash);
  if (hashSpec) state.spec = hashSpec[1];
}
renderAll();
track("view", !shared && state.savedAt ? progressSummary() : null);
// Notes to the admin carry the level and build being looked at.
window.shamanNoteContext = () => ({ lvl: state.lvl, spec: state.spec, about: shared ? (shared.by ? shared.by + "’s shared build" : "a shared build") : "" });

app.addEventListener("change", (e) => {
  if (shared) return;
  const t = e.target;
  if (t.classList && t.classList.contains("tick")) {
    const id = t.getAttribute("data-id");
    if (!ITEMS[id]) return;
    if (t.checked) state.have.add(id); else state.have.delete(id);
    const li = t.closest(".slot");
    if (li) li.classList.toggle("is-have", t.checked);
    refreshOwned();
    changed();
  } else if (t.name === "spec") {
    if (!LEVELS[20].specs[t.value]) return;
    state.spec = t.value;
    renderBuild();
    changed();
  } else if (t.name === "lvl") {
    SITE.setLevel(t.value);
  } else if (t.hasAttribute && t.hasAttribute("data-prof")) {
    const p = t.getAttribute("data-prof");
    if (!PROF_NAME[p]) return;
    if (t.checked) state.profs.add(p); else state.profs.delete(p);
    renderBuild();
    changed();
  }
});

app.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { goTo(go.getAttribute("data-go")); return; }
  const reset = e.target.closest("#reset-btn");
  if (reset) { onReset(reset); return; }
  const share = e.target.closest("#share-btn");
  if (share) onShare(share);
});

// The level cap changed (the owner raised it, or the visitor picked a level).
SITE.onChange(() => {
  if (shared) return;
  const lvl = SITE.level();
  const hasBar = !!app.querySelector(".lvlbar");
  const wantBar = SITE.levels().length > 1;
  if (lvl === state.lvl && hasBar === wantBar) return;
  state.lvl = lvl;
  renderAll();
  track("state", progressSummary());
});

window.addEventListener("storage", (e) => {
  if (shared || e.key !== STORE_KEY) return;
  const next = readState();
  state.have = next.have;
  state.profs = next.profs;
  state.spec = next.spec;
  state.savedAt = next.savedAt;
  renderAll();
});

if (/^#[A-Za-z0-9._~-]+$/.test(location.hash) && !/^#(enh|ele|resto)$/.test(location.hash)) {
  const target = document.getElementById(location.hash.slice(1));
  if (target) requestAnimationFrame(() => target.scrollIntoView());
}

})();
</script>
</body>
</html>
